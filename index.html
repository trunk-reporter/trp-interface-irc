}

hamburgerBtn.addEventListener('click', () => openDrawer('channels'));
usersBtn.addEventListener('click', () => openDrawer('users'));
drawerBackdrop.addEventListener('click', closeDrawers);

// Swipe gestures for mobile drawers
let touchStartX = 0;
let touchStartY = 0;
const SWIPE_THRESHOLD = 50;
const EDGE_ZONE = 30; // pixels from screen edge

document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  // Only trigger on horizontal swipes (not vertical scroll)
  if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dy) > Math.abs(dx)) return;
  if (window.innerWidth > 768) return;

  if (dx > 0 && touchStartX < EDGE_ZONE) {
    // Swipe right from left edge — open channels
    openDrawer('channels');
  } else if (dx < 0 && touchStartX > window.innerWidth - EDGE_ZONE) {
    // Swipe left from right edge — open users
    openDrawer('users');
  } else if (dx < 0 && channelTree.classList.contains('open')) {
    closeDrawers();
  } else if (dx > 0 && nicklist.classList.contains('open')) {
    closeDrawers();
  }
}, { passive: true });


// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

async function init() {
  initStatusChannel();
  switchChannel(STATUS_CHANNEL);
  renderTree();

  serverMsg(`Radio IRC — a Trunk Recorder Pro interface (read-only)`);
  serverMsg(`Recorder: ${rec.httpBase}`);
  serverMsg(`Transcripts: ${TRANSCRIBE_BASE}`);
  serverMsg('');
  setConnectionState('connecting');

  // Bootstrap at the recorder's hello: channels → recent calls → radios and affiliations; then transcripts
  initResizablePanels();
  window.addEventListener('resize', () => {
    if (isMobileLayout()) return;
    const left = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--channel-tree-width')) || 240;
    const right = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nicklist-width')) || 164;
    applyPanelWidth('--channel-tree-width', Math.max(180, Math.min(left, Math.floor(window.innerWidth * 0.5))));
    applyPanelWidth('--nicklist-width', Math.max(140, Math.min(right, Math.floor(window.innerWidth * 0.4))));
  });
  // Status bar ticker
  setInterval(updateStatusBar, 1000);
  updateStatusBar();
}

// ── The recorder's messages ──
let droppedAt = 0;

rec.on('connection', (up) => {
  setConnectionState(up ? 'connected' : 'disconnected');
  if (!up) {
    droppedAt = Date.now();
    serverMsg('Connection to the recorder lost, reconnecting...');
  }
});

rec.on('hello', (m) => {
  syncedSinceHello = false;
  hasControl = Boolean(m.configPath);
  updateSyncUI();
  statusServer.textContent = `trunk-pro ${m.version || ''}`.trim();
  if (!bootstrapped) {
    serverMsg(`Connected to Trunk Recorder Pro ${m.version || ''}`.trim());
    if (rec.phase.phase !== 'running') serverMsg(`The recorder is ${rec.phase.phase}${rec.phase.error ? ': ' + rec.phase.error : ''}`);
    bootstrapChannels();
    bootstrapRecentCalls();
    bootstrapped = true;
    seedRecNameSeen();
    bootstrapUnits();
    connectTranscripts();
  } else {
    serverMsg('Reconnected to the recorder');
    catchUpHistory(droppedAt - 60000);
  }
});


// ══════════════════════════════════════════════════════════════
// LIVE LISTENING
// ══════════════════════════════════════════════════════════════
// The recorder's live audio (rec.listen(): every call) and client.js's LivePlayer, as in
// OmniTrunker: one AudioContext made on the LISTEN click (or a typed /listen), one LivePlayer per
// call on the air mixed into it, each panned to its talkgroup's spot. Only the chunks of the
// talkgroups the mode wants are played; the rest are dropped here.

const listenBtn = document.getElementById('listen-btn');
const listenLabel = document.getElementById('listen-label');
const listenCount = document.getElementById('listen-count');
const listenModeEl = document.getElementById('listen-mode');
const listenVolEl = document.getElementById('listen-vol');

const LISTEN_MODES = ['channel', 'starred', 'scan'];
let listenMode = LISTEN_MODES.includes(localStorage.getItem('irc_listen_mode')) ? localStorage.getItem('irc_listen_mode') : 'channel';
let listenVolume = (() => {
  const v = parseInt(localStorage.getItem('irc_volume'), 10);
  return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 80;
})();
// 80, the default, is the player's own gain of 2 (OmniTrunker's mapping).
let liveGain = 2.5 * listenVolume / 100;
let liveListening = false;
let listenStarting = false; // between the click and the context running
let sharedCtx = null;
let closedCtx = null; // the last one closed by stopListening, for debug()
// callId (as text) → { player, sys, tgid, key ("short:tg"), quietSince (ms, 0 while playing) }
const livePlayers = new Map();
// The "short:tg" keys the mode wants now; the ones being heard now (a player's nowPlaying set).
let wantedKeys = new Set();
let audibleKeys = new Set();
// A player whose call has been quiet this long (past its own quietS) is dropped.
const PLAYER_IDLE_MS = 5000;

/** Each talkgroup at its own spot, -0.8 … 0.8 (tr-engine's audio-engine.js, as OmniTrunker). */
function panFor(tgid) {
  const h = ((Number(tgid) * 2654435761) >>> 0) % 10000;
  return -0.8 + (h / 10000) * 1.6;
}

function channelKey(chanName) {
  if (isMetaChannel(chanName)) return null;
  const ch = channels.get(chanName);
  return ch && ch.tgid ? `${ch.system_id}:${ch.tgid}` : null;
}

/** Is this channel's talkgroup being heard right now (the tree's speaker mark)? */
function isAudible(chanName) {
  if (!liveListening || audibleKeys.size === 0) return false;
  const key = channelKey(chanName);
  return !!key && audibleKeys.has(key);
}

/** The talkgroups to hear: the channel you're in, plus the favourites or the scan list. */
function computeWanted() {
  const s = new Set();
  const own = channelKey(activeChannel);
  if (own) s.add(own);
  if (listenMode === 'starred') for (const k of favorites) s.add(k);
  if (listenMode === 'scan') for (const k of scanChannels) s.add(k);
  for (const k of ignoredLocal) s.delete(k);   // heard nowhere here
  return s;
}

/** The channel, a favourite, the scan list or the mode changed: hear what is wanted now. */
function liveWantedChanged() {
  wantedKeys = computeWanted();
  if (liveListening) rec.listen(listenFilter());
  dropUnwantedPlayers();
  updateListenUI();
}

/**
 * What to ask the recorder for: one talkgroup wanted, just its audio (the recorder filters by
 * system and talkgroup); more than one, everything, and the chunks not wanted are dropped.
 */
function listenFilter() {
  if (wantedKeys.size !== 1) return {};
  const key = wantedKeys.values().next().value;
  const i = key.lastIndexOf(':');
  return { system: key.slice(0, i), talkgroup: Number(key.slice(i + 1)) };
}

function dropPlayer(callId) {
  const p = livePlayers.get(callId);
  if (!p) return;
  p.player.stop(); // with the shared context: just this player's nodes
  livePlayers.delete(callId);
}

/** Players whose talkgroup fell out of the wanted set. */
function dropUnwantedPlayers() {
  for (const [id, p] of Array.from(livePlayers)) if (!wantedKeys.has(p.key)) dropPlayer(id);
}

/** A call left the air (syncCalls): its player goes with it. */
function liveCallEnded(callId) {
  dropPlayer(String(callId));
}

rec.on('audio', (chunk) => {
  if (!liveListening || !sharedCtx) return;
  const sys = systemName(rec.status, chunk.system);
  const key = `${sys}:${chunk.talkgroup}`;
  if (!wantedKeys.has(key)) return;
  const id = String(chunk.callId);
  let p = livePlayers.get(id);
  if (!p) {
    // Both client.js generations: v0.2.11's takes the AudioContext (`context`), the next takes a
    // node to play into (`output`); each ignores the other's option.
    const player = new LivePlayer({ followCall: false, gain: liveGain, pan: panFor(chunk.talkgroup), context: sharedCtx, output: sharedCtx.destination });
    p = { player, sys, tgid: chunk.talkgroup, key, quietSince: 0 };
    livePlayers.set(id, p);
    player.resume().catch(() => {});
  }
  p.player.play(chunk);
});

/** Start hearing live: from a click or a typed command (the gesture the AudioContext needs). */
async function startListening() {
  if (liveListening || listenStarting) return true;
  listenStarting = true;
  try {
    sharedCtx = new AudioContext(); // made in the gesture, before any await
    await sharedCtx.resume();
  } catch (e) {
    if (sharedCtx) sharedCtx.close().catch(() => {});
    sharedCtx = null;
    serverMsg(`Live listening could not start: ${e && e.message ? e.message : e}`);
    return false;
  } finally {
    listenStarting = false;
  }
  if (!sharedCtx) return false; // stopped while starting
  liveListening = true;
  wantedKeys = computeWanted();
  rec.listen(listenFilter());
  updateListenUI();
  renderTree();
  addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Listening live (${listenMode}): ${describeWanted()}. The scanner's auto-play is paused meanwhile.` });
  return true;
}

function stopListening() {
  if (!liveListening && !sharedCtx) return;
  rec.listen(false);
  for (const id of Array.from(livePlayers.keys())) dropPlayer(id);
  if (sharedCtx) sharedCtx.close().catch(() => {});
  closedCtx = sharedCtx;
  sharedCtx = null;
  liveListening = false;
  audibleKeys = new Set();
  updateListenUI();
  renderTree();
}

function setListenMode(mode) {
  if (!LISTEN_MODES.includes(mode)) return;
  listenMode = mode;
  listenModeEl.value = mode;
  localStorage.setItem('irc_listen_mode', mode);
  liveWantedChanged();
}

function setLiveVolume(v) {
  listenVolume = Math.max(0, Math.min(100, parseInt(v, 10) || 0));
  liveGain = 2.5 * listenVolume / 100;
  listenVolEl.value = listenVolume;
  localStorage.setItem('irc_volume', String(listenVolume));
  for (const p of livePlayers.values()) setPlayerGain(p.player, liveGain);
}

/** The volume, on either client.js: `setGain()` (v0.2.11) or the `gain` setter (after it). */
function setPlayerGain(player, g) {
  if (typeof player.setGain === 'function') player.setGain(g);
  else player.gain = g;
}

function describeWanted() {
  const n = wantedKeys.size;
  if (n === 0) return listenMode === 'channel' ? 'nothing until you join a channel' : `nothing (no ${listenMode === 'scan' ? 'scan list' : 'favourites'} and no channel joined)`;
  return `${n} talkgroup${n === 1 ? '' : 's'}`;
}

function updateListenUI() {
  listenBtn.classList.toggle('active', liveListening);
  listenLabel.textContent = liveListening ? 'LISTENING' : 'LISTEN';
  let playing = 0;
  if (liveListening) for (const p of livePlayers.values()) if (p.player.nowPlaying) playing++;
  const count = liveListening ? `♪ ${playing}` : '';
  if (listenCount.textContent !== count) listenCount.textContent = count;
  listenBtn.title = liveListening
    ? `Listening live (${listenMode}): ${describeWanted()}, ${playing} playing. Click to stop.`
    : 'Listen live: hear the calls as they happen (the mode picks which channels)';
}

listenBtn.addEventListener('click', () => { if (liveListening) stopListening(); else startListening(); });
listenModeEl.value = listenMode;
listenModeEl.addEventListener('change', () => setListenMode(listenModeEl.value));
listenVolEl.value = listenVolume;
listenVolEl.addEventListener('input', () => setLiveVolume(listenVolEl.value));
updateListenUI();

// Four times a second: quiet players go, the speaker marks and the ♪ count follow nowPlaying.
setInterval(() => {
  if (!liveListening) return;
  const now = Date.now();
  for (const [id, p] of Array.from(livePlayers)) {
    if (p.player.nowPlaying) { p.quietSince = 0; continue; }
    if (!p.quietSince) p.quietSince = now;
    else if (now - p.quietSince > PLAYER_IDLE_MS) dropPlayer(id);
  }
  const heard = new Set();
  for (const p of livePlayers.values()) if (p.player.nowPlaying) heard.add(p.key);
  const changed = heard.size !== audibleKeys.size || [...heard].some(k => !audibleKeys.has(k));
  audibleKeys = heard;
  if (changed) renderTree();
  updateListenUI();
}, 250);

// For checking in a console (the page's variables are inside this module).
window._ircAudio = {
  listening: () => liveListening,
  mode: () => listenMode,
  wanted: () => [...wantedKeys],
  debug: () => ({
    // While off: the state of the context last closed ("closed"), or null if never started.
    contextState: sharedCtx ? sharedCtx.state : (closedCtx ? closedCtx.state : null),
    mode: listenMode,
    volume: listenVolume,
    gain: liveGain,
    audible: [...audibleKeys],
    players: Array.from(livePlayers).map(([callId, p]) => ({
      callId,
      system: p.sys,
      talkgroup: p.tgid,
      pan: p.player.panValue,
      gain: p.player.gainValue,
      nowPlaying: p.player.nowPlaying,
      sharedContext: !!sharedCtx && p.player._ctx === sharedCtx,
      onAir: (rec.calls || []).some(c => String(c.id) === callId),
    })),
  }),
};

rec.on('state', (m) => {
  if (bootstrapped) serverMsg(`The recorder is ${m.phase}${m.error ? ': ' + m.error : ''}`);
  syncCalls();
});
rec.on('status', syncCalls);
rec.on('concluded', (m) => handleConcluded(m.entry));
rec.on('monitorEvent', (m) => { if (bootstrapped && m.kind === 'unitAffiliated') handleAffiliation(m); });
rec.on('callsResult', answerQuery);
rec.on('radioResult', answerQuery);
rec.on('stats', showDecodeRate);
rec.on('config', onConfigChanged);
rec.on('unitNames', onConfigChanged);       // radio names arrive as rows, not in the config
rec.on('unitNameEdited', onConfigChanged);
rec.on('talkgroups', (m) => refreshTalkgroups(m.system));
rec.on('talkgroupEdited', handleTalkgroupEdited);
rec.on('error', (m) => serverMsg(`Recorder: ${m.message}`));

init();
inputField.focus();
</script>
<div class="vignette-overlay"></div>
<div class="theme-label" id="themeLabel"></div>
<script src="theme-engine.js"></script>

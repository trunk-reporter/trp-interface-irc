// CHANNEL SWITCHING
// ══════════════════════════════════════════════════════════════

function switchChannel(ch) {
  if (!channels.has(ch)) return;

  // Cancel any in-progress edit
  if (channelEditActive) cancelChannelEdit();
  if (descEditActive) cancelDescEdit();

  activeChannel = ch;
  markChannelRead(ch);

  const state = channels.get(ch);
  const displayName = ch;
  const titlebarDisplayName = state.tgid ? `${displayName} (TG ${state.tgid})` : displayName;
  const topic = state.description || state.tag || '';

  // Show/hide edit buttons based on whether channel has a tgid
  const showEdit = state.tgid ? 'inline-block' : 'none';
  chanEditBtn.style.display = showEdit;
  titlebarEditBtn.style.display = showEdit;

  chanNameEl.textContent = displayName;
  chanTopicEl.textContent = topic;
  chanModeEl.textContent = state.mode ? `[${state.mode}]` : '';
  titlebarChan.textContent = titlebarDisplayName;
  titlebarTopic.textContent = topic;
  inputPrompt.textContent = `[${displayName}]`;

  // Render messages
  messagesEl.innerHTML = '';
  lastRenderedDateStr = '';
  for (const m of state.messages) appendMsgDOM(m);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  // Load history if this channel hasn't been populated yet, or fill viewport
  if (ch === STARRED_CHANNEL) {
    if (!channelHasActivity.has(ch) && !channelLoading.has(ch)) {
      loadStarredHistory();
    }
  } else if (state.tgid && !channelLoading.has(ch)) {
    if (!channelHasActivity.has(ch)) {
      lazyLoadChannel(ch, state.system_id, state.tgid).then(() => ensureChannelFilled(ch));
    } else {
      ensureChannelFilled(ch);
    }
  }

  // Typing
  const t = typingState.get(ch);
  if (t) typingBar.innerHTML = `<span class="typing-nick">${esc(t.nick)}</span> is typing...`;
  else typingBar.innerHTML = '';

  renderTree();
  renderNicklist();
  liveWantedChanged();

  // Close mobile drawer on channel switch
  if (window.innerWidth <= 768) closeDrawers();
}

/** A recorded call (the recorder's CallEntry) → the call shape this page's renderers read
 *  (tr-engine's call fields). `call_id` is the entry's path; times are Unix ms; each keyup in
 *  `src_list` gets its place in the audio (`pos`) and its length (to the next keyup, or the end). */
function entryToCall(entry) {
  const r = entry.record || {};
  const startMs = r.start_time_ms || (r.start_time || 0) * 1000;
  const lenS = r.call_length_ms != null ? r.call_length_ms / 1000 : (r.call_length || 0);
  const srcs = [...(r.srcList || [])].sort((a, b) => (a.pos || 0) - (b.pos || 0));
  return {
    call_id: entry.path,
    path: entry.path,
    // Its audio stays in the recordings folder (false: deleted once the plugins were done).
    audio: entry.audio !== false,
    system_id: r.short_name || '',
    tgid: r.talkgroup,
    tg_alpha_tag: r.talkgroup_tag || '',
    tg_description: r.talkgroup_description || '',
    tg_tag: r.talkgroup_group_tag || '',
    tg_group: r.talkgroup_group || '',
    start_time: startMs,
    stop_time: r.stop_time_ms || (r.stop_time || 0) * 1000,
    duration: lenS,
    emergency: !!r.emergency,
    // Encrypted and not decrypted: no voice to hear or transcribe.
    encrypted: !!r.encrypted && !r.decrypted,
    unit_ids: srcs.map(s => s.src),
    src_list: srcs.map((s, i) => {
      const pos = s.pos || 0;
      const end = i + 1 < srcs.length ? (srcs[i + 1].pos || 0) : lenS;
      return {
        src: s.src, tag: s.tag || s.tag_ota || '', pos,
        time: startMs + pos * 1000,
        duration: Math.max(0, end - pos),
        emergency: s.emergency,
      };
    }),
  };
}

/** The fields every message of a call carries: its path (audio and transcript), its system, start and talkers. */
function callFields(call, sid) {
  return {
    callId: call.call_id, path: call.path, noAudio: call.audio === false,
    systemId: sid, callStart: call.start_time, talkers: call.unit_ids || [],
  };
}

// Copies of one transmission saved from several sites share a transmission_id: transmission_id → the path shown.
const transmissionPaths = new Map();
/** Another site's copy of a call already shown (same transmission_id, another path). */
function isDuplicateCopy(entry) {
  const t = entry && entry.record && entry.record.transmission_id;
  if (!t) return false;
  const shown = transmissionPaths.get(t);
  if (shown) return shown !== entry.path;
  transmissionPaths.set(t, entry.path);
  if (transmissionPaths.size > 20000) transmissionPaths.delete(transmissionPaths.keys().next().value);
  return false;
}

/** Convert calls (entryToCall) into message objects for a channel. Returns messages oldest-first. Deduplicates by call_id. */
function callsToMessages(calls, chanName, systemId) {
  const msgs = [];
  const ch = channels.get(chanName);
  if (!channelLoadedCallIds.has(chanName)) channelLoadedCallIds.set(chanName, new Set());
  const loadedIds = channelLoadedCallIds.get(chanName);
  const sorted = [...calls].reverse(); // the recorder answers newest-first; flip to oldest-first
  for (const call of sorted) {
    if (loadedIds.has(call.call_id)) continue;
    loadedIds.add(call.call_id);
    const srcList = call.src_list || [];
    const isEmergency = call.emergency || false;
    const sid = call.system_id || systemId;
    // Where older history goes on from: the start of the oldest call shown.
    if (ch && call.start_time && (!ch.oldestStartMs || call.start_time < ch.oldestStartMs)) ch.oldestStartMs = call.start_time;

    // Cache src_list for player segment display
    if (srcList.length > 0) callSrcLists.set(call.call_id, srcList);

    if (call.encrypted) {
      const unitIds = call.unit_ids || [];
      const srcNick = unitIds.length > 0
        ? resolveNick(sid, unitIds[0], '')
        : (call.tg_alpha_tag || `TG ${call.tgid}`);
      if (unitIds.length > 0 && ch) ensureUserInChannel(ch, chanName, sid, unitIds[0], '');
      const callTime = call.start_time ? new Date(call.start_time) : new Date();
      const dur = call.duration ? fmtDuration(call.duration) : '';
      msgs.push({
        ts: ts(callTime), date: callTime, nick: srcNick, encrypted: true,
        text: `[encrypted${dur ? ', ' + dur : ''}]`,
      });
    } else if (srcList.length > 0) {
      const txSorted = [...srcList].sort((a, b) => (a.pos || 0) - (b.pos || 0));
      for (const tx of txSorted) {
        const nick = resolveNick(sid, tx.src, tx.tag);
        const txTime = tx.time ? new Date(tx.time) : (call.start_time ? new Date(call.start_time) : new Date());
        const dur = tx.duration ? fmtDuration(tx.duration) : '';
        if (ch) ensureUserInChannel(ch, chanName, sid, tx.src, tx.tag);
        msgs.push(Object.assign({
          ts: ts(txTime), date: txTime, nick, src: tx.src,
          pos: tx.pos || 0, txDuration: tx.duration || 0,
          duration: dur, channel: chanName,
          emergency: isEmergency || tx.emergency === 1,
        }, callFields(call, sid)));
      }
    } else {
      const srcNick = call.tg_alpha_tag || `TG ${call.tgid}`;
      const callTime = call.start_time ? new Date(call.start_time) : new Date();
      const dur = call.duration ? fmtDuration(call.duration) : '';
      msgs.push(Object.assign({
        ts: ts(callTime), date: callTime, nick: srcNick,
        duration: dur, channel: chanName, emergency: isEmergency,
      }, callFields(call, sid)));
    }
  }
  return msgs;
}

/** Merge two message arrays by date (oldest-first). */
function mergeByTime(a, b) {
  const merged = [...a, ...b];
  merged.sort((x, y) => (x.date || 0) - (y.date || 0));
  return merged;
}

const HISTORY_PAGE_SIZE = 50;

async function lazyLoadChannel(chanName, systemId, tgid) {
  channelLoading.add(chanName);
  const ch = channels.get(chanName);
  if (!ch) { channelLoading.delete(chanName); return; }

  try {
    // The recorder's call store (callsQuery), newest first. The next page goes on from the
    // last one's cursor; the first from the start of the oldest call shown.
    const q = { system: systemId, talkgroup: tgid, limit: HISTORY_PAGE_SIZE };
    if (ch.historyCursor) q.cursor = ch.historyCursor;
    else if (ch.oldestStartMs) q.to = ch.oldestStartMs;
    const res = await queryCalls(q);
    const calls = (res.entries || []).filter(e => e.record && !isDuplicateCopy(e)).map(entryToCall);
    ch.historyCursor = res.next || null;
    if (!res.next) ch.historyExhausted = true;

    if (calls.length === 0) return;

    const newMsgs = callsToMessages(calls, chanName, systemId);

    // Prepend older messages to the beginning of the channel's messages array
    ch.messages.unshift(...newMsgs);

    // Trim excess from the end if needed
    while (ch.messages.length > MAX_MESSAGES) ch.messages.pop();

    channelHasActivity.add(chanName);

    // Re-render if still on this channel, preserving scroll position
    if (activeChannel === chanName) {
      const prevScrollTop = messagesEl.scrollTop;
      const prevScrollHeight = messagesEl.scrollHeight;
      const wasAtBottom = prevScrollHeight - prevScrollTop - messagesEl.clientHeight < 80;
      messagesEl.innerHTML = '';
      lastRenderedDateStr = '';
      for (const m of ch.messages) appendMsgDOM(m);
      const newScrollHeight = messagesEl.scrollHeight;
      if (wasAtBottom && prevScrollHeight <= messagesEl.clientHeight) {
        // First load or content didn't fill viewport — scroll to bottom
        messagesEl.scrollTop = newScrollHeight;
      } else {
        // Preserve view: offset by the height of prepended content
        messagesEl.scrollTop = prevScrollTop + (newScrollHeight - prevScrollHeight);
      }
      renderNicklist();
    }
    renderTree();

    // Fetch transcripts for the loaded calls (async, non-blocking)
    fetchTranscriptionsForCalls(calls.map(c => c.path));
  } catch (err) {
    serverMsgTo(chanName, `Failed to load history: ${err.message}`);
  } finally {
    channelLoading.delete(chanName);
  }
}


/** Keep loading older history until the messages area is scrollable or data is exhausted. */
async function ensureChannelFilled(chanName) {
  const ch = channels.get(chanName);
  if (!ch || !ch.tgid || ch.historyExhausted || channelLoading.has(chanName)) return;
  if (activeChannel !== chanName) return;

  // If content already fills the viewport, nothing to do
  if (messagesEl.scrollHeight > messagesEl.clientHeight + 40) return;

  await lazyLoadChannel(chanName, ch.system_id, ch.tgid);

  // Recurse until filled or exhausted
  if (activeChannel === chanName && !ch.historyExhausted) {
    ensureChannelFilled(chanName);
  }
}

// Scroll-to-top handler: load older messages when scrolling up
messagesEl.addEventListener('scroll', () => {
  if (messagesEl.scrollTop > 100) return; // not near top
  if (!activeChannel || activeChannel === STATUS_CHANNEL) return;
  if (activeChannel === STARRED_CHANNEL) {
    const st = channels.get(STARRED_CHANNEL);
    if (!st || st.historyExhausted || channelLoading.has(STARRED_CHANNEL)) return;
    loadStarredHistory();
    return;
  }
  const ch = channels.get(activeChannel);
  if (!ch || !ch.tgid || ch.historyExhausted || channelLoading.has(activeChannel)) return;
  lazyLoadChannel(activeChannel, ch.system_id, ch.tgid);
});

/** Load history for the starred channel: one callsQuery per favorited talkgroup, merged by time */
async function loadStarredHistory() {
  const st = channels.get(STARRED_CHANNEL);
  if (!st || channelLoading.has(STARRED_CHANNEL)) return;
  channelLoading.add(STARRED_CHANNEL);

  try {
    // Collect favorited talkgroups ("shortName:tgid")
    const favTGs = [];
    for (const key of favorites) {
      const i = key.lastIndexOf(':');
      const sysId = key.slice(0, i);
      const tgid = Number(key.slice(i + 1));
      if (sysId && tgid) favTGs.push({ system_id: sysId, tgid });
    }
    if (favTGs.length === 0) {
      st.historyExhausted = true;
      return;
    }

    // Time-cursor: everything that started before the oldest call in the starred channel
    let oldest = st.oldestStartMs || null;
    if (!oldest) {
      const first = st.messages.find(m => m.date);
      if (first) oldest = first.date.getTime();
    }

    // Fetch from each favorited talkgroup in parallel (limited batch)
    const perTG = Math.max(3, Math.floor(20 / favTGs.length));
    const fetches = favTGs.map(tg => {
      const q = { system: tg.system_id, talkgroup: tg.tgid, limit: perTG };
      if (oldest) q.to = oldest;
      return queryCalls(q)
        .then(data => ({ calls: (data.entries || []).filter(e => e.record && !isDuplicateCopy(e)).map(entryToCall), system_id: tg.system_id, tgid: tg.tgid }))
        .catch(() => ({ calls: [], system_id: tg.system_id, tgid: tg.tgid }));
    });
    const results = await Promise.all(fetches);

    // Merge all calls and convert to messages with origin tags
    let allCalls = [];
    let anyHadData = false;
    for (const r of results) {
      if (r.calls.length > 0) anyHadData = true;
      for (const call of r.calls) {
        call._origin_system_id = r.system_id;
        allCalls.push(call);
      }
    }
    if (!anyHadData) {
      st.historyExhausted = true;
    }

    // Sort newest-first then flip to oldest-first for message construction
    allCalls.sort((a, b) => (b.start_time || 0) - (a.start_time || 0));

    // Dedup by call_id
    if (!channelLoadedCallIds.has(STARRED_CHANNEL)) channelLoadedCallIds.set(STARRED_CHANNEL, new Set());
    const loadedIds = channelLoadedCallIds.get(STARRED_CHANNEL);
    const newMsgs = [];

    for (const call of allCalls.reverse()) { // oldest-first
      if (loadedIds.has(call.call_id)) continue;
      loadedIds.add(call.call_id);
      if (call.start_time && (!st.oldestStartMs || call.start_time < st.oldestStartMs)) st.oldestStartMs = call.start_time;

      const systemId = call.system_id || call._origin_system_id;
      const chanName = resolveChannel(systemId, call.tgid);
      const srcList = call.src_list || [];
      const isEmergency = call.emergency || false;

      if (srcList.length > 0) callSrcLists.set(call.call_id, srcList);

      if (call.encrypted) {
        const callTime = new Date(call.start_time);
        const dur = call.duration ? fmtDuration(call.duration) : '';
        newMsgs.push({
          ts: ts(callTime), date: callTime, encrypted: true,
          nick: call.unit_ids.length ? resolveNick(systemId, call.unit_ids[0], '') : (call.tg_alpha_tag || 'TG ' + call.tgid),
          text: `[encrypted${dur ? ', ' + dur : ''}]`, originChannel: chanName || null,
        });
        continue;
      }

      const txList = srcList.length > 0
        ? [...srcList].sort((a, b) => (a.pos || 0) - (b.pos || 0))
        : [{ src: 0, tag: call.tg_alpha_tag || 'TG ' + call.tgid }];

      for (const tx of txList) {
        const nick = tx.src ? resolveNick(systemId, tx.src, tx.tag) : (call.tg_alpha_tag || 'TG ' + call.tgid);
        const txTime = tx.time ? new Date(tx.time) : new Date(call.start_time);
        const dur = tx.duration ? fmtDuration(tx.duration) : (call.duration ? fmtDuration(call.duration) : '');

        newMsgs.push(Object.assign({
          ts: ts(txTime), date: txTime,
          nick, src: tx.src,
          pos: tx.pos || 0, txDuration: tx.duration || 0,
          duration: dur,
          channel: chanName || STARRED_CHANNEL,
          emergency: isEmergency || (tx.emergency === 1),
          originChannel: chanName || null,
        }, callFields(call, systemId)));
      }
    }

    // Prepend older messages
    st.messages.unshift(...newMsgs);
    while (st.messages.length > MAX_MESSAGES) st.messages.pop();

    if (newMsgs.length > 0) channelHasActivity.add(STARRED_CHANNEL);

    // Re-render if still on starred channel, preserving scroll position
    if (activeChannel === STARRED_CHANNEL) {
      const prevScrollTop = messagesEl.scrollTop;
      const prevScrollHeight = messagesEl.scrollHeight;
      const wasAtBottom = prevScrollHeight - prevScrollTop - messagesEl.clientHeight < 80;
      messagesEl.textContent = '';
      lastRenderedDateStr = '';
      for (const m of st.messages) appendMsgDOM(m);
      const newScrollHeight = messagesEl.scrollHeight;
      if (wasAtBottom && prevScrollHeight <= messagesEl.clientHeight) {
        messagesEl.scrollTop = newScrollHeight;
      } else {
        messagesEl.scrollTop = prevScrollTop + (newScrollHeight - prevScrollHeight);
      }
    }
    renderTree();

    // Fetch transcripts
    fetchTranscriptionsForCalls(allCalls.map(c => c.path));
  } catch (err) {
    console.error('Failed to load starred history:', err);
  } finally {
    channelLoading.delete(STARRED_CHANNEL);
  }
}


// ══════════════════════════════════════════════════════════════
// RECORDER API — queries over the recorder's connection (rec),
// and the transcribe plugin's HTTP API
// ══════════════════════════════════════════════════════════════

// Our own callsQuery / radioQuery, answered by id (callsResult / radioResult). The ids start
// high, clear of client.js's own.
const pendingQueries = new Map(); // id → { resolve, timer }
let nextQueryId = 100000;

function askRecorder(msg, timeoutMs = 20000) {
  const id = nextQueryId++;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingQueries.delete(id);
      reject(new Error(`no answer to ${msg.type} in ${timeoutMs / 1000} s`));
    }, timeoutMs);
    pendingQueries.set(id, { resolve, timer });
    rec.send(Object.assign({}, msg, { id }));
  });
}

function answerQuery(m) {
  const q = pendingQueries.get(m.id);
  if (!q) return;
  pendingQueries.delete(m.id);
  clearTimeout(q.timer);
  q.resolve(m);
}

/** Recorded calls, newest first (callsQuery): { entries, next?, error? }. */
function queryCalls(q) { return askRecorder(Object.assign({ type: 'callsQuery' }, q)); }

/** The radio registry (radioQuery): what the recorder has heard of each system. */
function queryRadio(q) { return askRecorder(Object.assign({ type: 'radioQuery' }, q)); }

/** GET from the transcribe plugin. */
async function fetchTranscribe(path) {
  const res = await fetch(TRANSCRIBE_BASE + path);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} from ${TRANSCRIBE_BASE}${path}`);
  return res.json();
}

// ── Systems and talkgroups, from the recorder's config and talkgroup files ──

/** Every system's short name and name (trunked, then conventional) into systemNames. */
function loadSystemNames() {
  const cfg = rec.config || {};
  for (const s of (cfg.systems || []).concat(cfg.conventional || [])) {
    if (s.shortName) systemNames.set(s.shortName, s.name || s.shortName);
  }
}

/** A channel's tree folder: its talkgroup's category, under its system's name when there are several systems. */
function groupFor(sys, category) {
  const g = category || 'Ungrouped';
  return systemNames.size > 1 ? `${systemNames.get(sys) || sys} / ${g}` : g;
}

/** A talkgroup's row in its system's talkgroup file (rec.talkgroups), or {}. */
function tgMeta(sys, tgid) {
  return (sys && rec.talkgroups(sys).get(tgid)) || {};
}

/** The channel of a system's talkgroup, made when it's new (named by its number when it isn't in the file). */
function talkgroupChannel(sys, tgid, alphaTag) {
  const existing = resolveChannel(sys, tgid);
  if (existing) return existing;
  const t = tgMeta(sys, tgid);
  return ensureChannel({
    system_id: sys, tgid,
    alpha_tag: t.alphaTag || alphaTag || '',
    description: t.description || '', tag: t.tag || '',
    group: groupFor(sys, t.group),
  });
}

/** A radio's name as the recorder has it (unit names, then the alias heard), or "". */
function recUnitName(sys, unit) {
  return unit != null && sys ? rec.unitName(sys, unit) : '';
}

function applyPanelWidth(varName, width) {
  document.documentElement.style.setProperty(varName, `${Math.round(width)}px`);
}

function isMobileLayout() {
  return window.matchMedia('(max-width: 768px)').matches;
}

function initResizablePanels() {
  const savedLeft = parseInt(localStorage.getItem('irc.channelTreeWidth') || '240', 10);
  const savedRight = parseInt(localStorage.getItem('irc.nicklistWidth') || '164', 10);
  applyPanelWidth('--channel-tree-width', Math.max(180, Math.min(savedLeft || 240, Math.max(180, Math.floor(window.innerWidth * 0.5)))));
  applyPanelWidth('--nicklist-width', Math.max(140, Math.min(savedRight || 164, Math.max(140, Math.floor(window.innerWidth * 0.4)))));

  function attachResizer(handle, side) {
    if (!handle) return;
    handle.addEventListener('pointerdown', (ev) => {
      if (isMobileLayout()) return;
      ev.preventDefault();
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';

      const onMove = (moveEv) => {
        const vw = window.innerWidth;
        if (side === 'left') {
          const width = Math.max(180, Math.min(moveEv.clientX, Math.floor(vw * 0.5)));
          applyPanelWidth('--channel-tree-width', width);
          localStorage.setItem('irc.channelTreeWidth', String(Math.round(width)));
        } else {
          const width = Math.max(140, Math.min(vw - moveEv.clientX, Math.floor(vw * 0.4)));
          applyPanelWidth('--nicklist-width', width);
          localStorage.setItem('irc.nicklistWidth', String(Math.round(width)));
        }
      };

      const stop = () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', stop);
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', stop, { once: true });
    });
  }

  attachResizer(channelResizerEl, 'left');
  attachResizer(nicklistResizerEl, 'right');
}

function bootstrapChannels() {
  loadSystemNames();
  serverMsg(`Loading the talkgroups of ${[...systemNames.values()].join(', ') || 'no systems'}...`);
  const tgs = [];
  for (const sys of systemNames.keys()) {
    for (const t of rec.talkgroups(sys).values()) {
      tgs.push({
        system_id: sys, tgid: t.talkgroup,
        alpha_tag: t.alphaTag || '', description: t.description || '', tag: t.tag || '',
        group: groupFor(sys, t.group), mode: t.mode || '',
      });
    }
  }
  tgs.sort((a, b) => (a.alpha_tag || String(a.tgid)).localeCompare(b.alpha_tag || String(b.tgid)));
  serverMsg(`Received ${tgs.length} talkgroups`);
  document.querySelector('.tree-header-text').textContent = [...systemNames.values()].join(', ') || 'trunk-pro';

  for (const tg of tgs) {
    const chanName = ensureChannel(tg);
    // Initial join message
    channels.get(chanName).messages.push({
      ts: ts(), kind: 'notice',
      text: `Now talking on ${chanName}`,
    });
    channels.get(chanName).messages.push({
      ts: ts(), kind: 'topic',
      text: `Topic for ${chanName}: ${tg.description || tg.alpha_tag || tg.tgid} [${tg.tag || ''}]`,
    });
    if (tg.mode) {
      channels.get(chanName).messages.push({
        ts: ts(), kind: 'mode',
        text: `${chanName} mode: ${tg.mode}`,
      });
    }
  }

  serverMsg(`Joined ${channels.size - 1} channels`);

  // Create starred meta-channel if user has favorites
  updateStarredChannel();

  renderTree();

  // Auto-switch to first real channel
  const firstChan = [...channels.keys()].find(k => !isMetaChannel(k));
  if (firstChan) switchChannel(firstChan);
}

/** A talkgroup file replaced or edited: new talkgroups get channels, known ones their new topic. */
function refreshTalkgroups(sys) {
  if (!bootstrapped || !sys) return;
  for (const t of rec.talkgroups(sys).values()) {
    const chanName = resolveChannel(sys, t.talkgroup);
    if (!chanName) { talkgroupChannel(sys, t.talkgroup, t.alphaTag); continue; }
    const ch = channels.get(chanName);
    if (!ch) continue;
    ch.description = t.description || '';
    ch.tag = t.tag || '';
    ch.group = groupFor(sys, t.group);
  }
  renderTree();
}

// Where each radio is affiliated now: "shortName:unit" → channel name.
const unitAffChannel = new Map();

/** The radios the recorder has heard (radioQuery units): their names, and the nicklists from where each is affiliated. */
async function bootstrapUnits() {
  serverMsg('Fetching the radios heard, and where each is affiliated...');
  let seeded = 0;
  let userCount = 0;
  let offlineCount = 0;
  const nowS = Date.now() / 1000;
  for (const sys of systemNames.keys()) {
    let res;
    try {
      res = await queryRadio({ what: 'units', system: sys, limit: 5000 });
      if (res.error) throw new Error(res.error);
    } catch (err) {
      serverMsg(`ERROR fetching the radios of ${sys}: ${err.message}`);
      continue;
    }
    for (const u of res.rows || []) {
      if (u.alias && u.alias.trim()) {
        resolveNick(sys, u.unit, u.alias, 'mqtt');
        seeded++;
      }
      if (u.aff == null) continue;
      const chanName = talkgroupChannel(sys, u.aff);
      const ch = channels.get(chanName);
      if (!ch) continue;

      const nick = resolveNick(sys, u.unit, u.alias);
      const role = roleForNick(nick);
      const prefix = role === 'op' ? '@' : '';
      // Online: not deregistered, and heard in the last hour.
      const online = u.reg !== false && nowS - (u.last || 0) < 3600;

      const uk = unitKey(sys, u.unit);
      unitAffChannel.set(uk, chanName);
      if (!ch.users.has(uk)) {
        ch.users.set(uk, { nick, prefix, role, unitId: u.unit, systemId: sys, affiliated: true, online });
        userCount++;
        if (!online) offlineCount++;
      }
    }
    serverMsg(`${sys}: ${(res.rows || []).length} of ${res.total ?? '?'} radios heard in ${res.hours ?? '?'} h`);
  }

  serverMsg(`Seeded ${seeded} unit nicks from the radios heard`);
  serverMsg(`${userCount} users loaded across channels (${userCount - offlineCount} online, ${offlineCount} offline)`);
  renderNicklist();
  renderTree();
}

/** The recorder's recent calls (rec.history, from hello) into their channels. */
function bootstrapRecentCalls() {
  const entries = rec.history || [];
  serverMsg(`Loading the recorder's recent calls (${entries.length})...`);

  // Group calls by channel
  const callsByChannel = new Map();
  let count = 0;
  for (const entry of entries) {
    if (!entry.record || isDuplicateCopy(entry)) continue;
    const r = entry.record;
    const chanName = talkgroupChannel(r.short_name, r.talkgroup, r.talkgroup_tag);
    if (!chanName || !channels.has(chanName)) continue;
    if (!callsByChannel.has(chanName)) callsByChannel.set(chanName, []);
    callsByChannel.get(chanName).push(entryToCall(entry));
    count++;
  }

  // Track which channels got backfill messages (for unread counts)
  const backfillCounts = new Map();
  const paths = [];

  for (const [chanName, chanCalls] of callsByChannel) {
    const ch = channels.get(chanName);
    if (!ch) continue;
    const msgs = callsToMessages(chanCalls, chanName, ch.system_id);
    ch.messages.push(...msgs);
    if (msgs.length > 0) backfillCounts.set(chanName, msgs.length);
    for (const c of chanCalls) paths.push(c.path);
  }

  // Set unread badges and activity flags for channels with backfill
  for (const [chanName, count] of backfillCounts) {
    channelHasActivity.add(chanName);
    // Don't set unread for the currently active channel, or for one that's ignored (nothing counts there)
    if (chanName !== activeChannel && !isIgnored(chanName)) {
      channelUnread.set(chanName, count);
      if (!channelLastMsgTs.has(chanName)) channelLastMsgTs.set(chanName, 0);
    }
  }

  // Recent emergency calls go in the Emergency channel too (oldest first)
  const emMsgs = [];
  for (const [chanName] of callsByChannel) {
    if (isIgnoredRecorder(chanName)) continue;
    for (const m of channels.get(chanName)?.messages || []) {
      if (m.emergency && m.kind !== 'notice' && (m.date?.getTime() || 0) > emergencyClearedAt) emMsgs.push(Object.assign({}, m, { originChannel: chanName, _el: null }));
    }
  }
  if (emMsgs.length) {
    emMsgs.sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
    const em = ensureEmergencyChannel();
    em.messages.push(...emMsgs);
    channelHasActivity.add(EMERGENCY_CHANNEL);
    if (activeChannel !== EMERGENCY_CHANNEL) { channelUnread.set(EMERGENCY_CHANNEL, emMsgs.length); channelLastMsgTs.set(EMERGENCY_CHANNEL, 0); }
  }

  serverMsg(`Loaded ${count} recent calls across ${backfillCounts.size} channels`);

  // Re-render if we're on a channel that got backfill
  if (activeChannel !== STATUS_CHANNEL) {
    messagesEl.innerHTML = '';
    lastRenderedDateStr = '';
    const state = channels.get(activeChannel);
    if (state) {
      for (const m of state.messages) appendMsgDOM(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  renderTree();

  // Fetch transcripts for loaded calls (async, non-blocking)
  fetchTranscriptionsForCalls(paths);
}

/** After a reconnect: the calls recorded while the connection was down (the greeting's history). */
function catchUpHistory(sinceMs) {
  const missed = (rec.history || []).filter(e => e.record && (e.record.start_time_ms || 0) >= sinceMs);
  missed.reverse(); // oldest first
  for (const e of missed) handleConcluded(e);
  if (missed.length) serverMsg(`Caught up on ${missed.length} calls recorded while disconnected`);
}

// ══════════════════════════════════════════════════════════════
// TRANSCRIPTS — the transcribe plugin's event stream (SSE)
// ══════════════════════════════════════════════════════════════

let transcriptState = 'off'; // connecting, connected, disconnected

function connectTranscripts() {
  if (sseConnection) {
    sseConnection.close();
    sseConnection = null;
  }

  const url = `${TRANSCRIBE_BASE}/api/v1/events`;
  serverMsg(`Connecting to the transcripts at ${url}...`);
  transcriptState = 'connecting';

  // No credentials; the browser resends Last-Event-ID when it reconnects, so nothing is missed.
  const es = new EventSource(url);
  sseConnection = es;

  es.onopen = () => {
    if (transcriptState !== 'connected') serverMsg('Connected to the transcript stream');
    transcriptState = 'connected';
  };

  es.onerror = () => {
    if (transcriptState === 'connected') {
      serverMsg('Transcript stream lost, reconnecting...');
    } else if (transcriptState === 'connecting') {
      serverMsg(`No transcripts from ${TRANSCRIBE_BASE} yet (is the transcribe plugin's http.port on, and this page's origin in its http.origins?). Retrying...`);
    }
    transcriptState = 'disconnected';
    // EventSource auto-reconnects
  };

  es.addEventListener('transcript', (e) => {
    lastEventId = e.lastEventId;
    try { handleTranscription(JSON.parse(e.data)); } catch (err) { console.warn('bad transcript event:', err); if (!badTranscriptWarned) { badTranscriptWarned = true; serverMsg('A transcript event could not be read (the plugin may have changed its format); see the console.'); } }
  });
}

// The recorder's decode rate in the title bar: control channel messages a second, every site of every system.
function showDecodeRate(m) {
  let good = 0;
  let any = false;
  for (const [k, v] of Object.entries(m.values || {})) {
    if (/^sys\/[^/]+\/(site\/.+\/)?cc\/good$/.test(k)) { good += Number(v) || 0; any = true; }
  }
  if (any && titlebarLag) titlebarLag.textContent = `decode: ${good.toFixed(1)} msg/s`;
}

function setConnectionState(state) {
  connectionState = state;
  if (window.ehSetNetworkStatus) window.ehSetNetworkStatus(state);
  const dot = treeStatus.querySelector('.dot');

  if (state === 'connected') {
    treeStatus.innerHTML = '<span class="dot connected"></span>Connected';
    statusDot.className = 'status-ok';
    statusDot.textContent = '●';
  } else if (state === 'connecting') {
    treeStatus.innerHTML = '<span class="dot connecting"></span>Connecting...';
    statusDot.className = 'status-err';
    statusDot.textContent = '○';
  } else {
    treeStatus.innerHTML = '<span class="dot disconnected"></span>Disconnected';
    statusDot.className = 'status-err';
    statusDot.textContent = '●';
  }
}

// ══════════════════════════════════════════════════════════════
// EVENT HANDLERS — calls, affiliations and transcripts to IRC actions
// ══════════════════════════════════════════════════════════════

/** A transcript from the transcribe plugin (its event stream or a fetch). */
function handleTranscription(t) {
  applyTranscript(t);
}

/** Put a transcript on its call's messages wherever they are (its channel, the starred channel);
 *  keep it for later when they aren't on the page yet (the call's recording hasn't come). */
function applyTranscript(t) {
  if (!t || !t.path) return;
  const chanName = resolveChannel(t.system, t.talkgroup);
  let applied = false;
  if (chanName && applyTranscriptionToChannel(chanName, t.path, t)) applied = true;
  if (channels.has(STARRED_CHANNEL) && applyTranscriptionToChannel(STARRED_CHANNEL, t.path, t)) applied = true;
  if (channels.has(EMERGENCY_CHANNEL) && applyTranscriptionToChannel(EMERGENCY_CHANNEL, t.path, t)) applied = true;
  if (applied) {
    pendingTranscriptions.delete(t.path);
    return;
  }
  pendingTranscriptions.set(t.path, t);
  // Evict stale entries if cache grows too large (calls never shown, or trimmed from scrollback)
  if (pendingTranscriptions.size > 500) {
    const keys = [...pendingTranscriptions.keys()];
    for (let i = 0; i < keys.length - 400; i++) pendingTranscriptions.delete(keys[i]);
  }
}

/** Apply a transcript to a call's messages in one channel. One line per segment, the radio named
 *  (a segment with no radio: the call's last talker, else "unknown"); the text alone when there
 *  are no segments; a skipped or failed one's reason, muted. Returns whether the call was there. */
/** "A, B +2": the radios heard in a call, for a transcript that can't say who said what. */
function talkersLabel(sid, units) {
  const names = units.slice(0, 2).map(u => resolveNick(sid, u, ''));
  return names.join(', ') + (units.length > 2 ? ` +${units.length - 2}` : '');
}
function applyTranscriptionToChannel(chanName, callId, t) {
  const ch = channels.get(chanName);
  if (!ch) return false;
  const callMsgs = ch.messages.filter(m => m.callId === callId);
  if (callMsgs.length === 0) return false;
  if (callMsgs.some(m => m.encrypted)) return true;

  const base = callMsgs[0];
  if (t.status !== 'ok') {
    base.text = `[${t.status || 'no transcript'}${t.reason ? ': ' + t.reason : ''}]`;
    base.textMuted = true;
    if (chanName === activeChannel) refreshMsgEl(base);
    return true;
  }

  const sid = base.systemId || t.system;
  const talkers = base.talkers || [];
  const lastTalker = talkers.length ? talkers[talkers.length - 1] : null;
  const distinctTalkers = [...new Set(talkers)];
  const startMs = base.callStart || t.startMs || (base.date ? base.date.getTime() : Date.now());
  const segs = (t.segments || []).filter(s => s && s.text && s.text.trim());

  let lines;
  if (segs.length > 0) {
    lines = segs.map(s => {
      // No radio on the segment (engines without word times give one segment for the whole call): with
      // several talkers, don't pin the whole conversation on the last one; name them all.
      const several = s.unit == null && distinctTalkers.length > 1;
      const unit = s.unit != null ? s.unit : (several ? null : lastTalker);
      const nick = several ? talkersLabel(sid, distinctTalkers)
        : (unit != null ? resolveNick(sid, unit, '') : 'unknown');
      // A label for several radios is no one's nick: kept apart so nick actions and renames don't take it for one.
      const talkerUnits = several ? distinctTalkers : undefined;
      const date = new Date(startMs + (s.start || 0) * 1000);
      const len = Math.max(0, (s.end || 0) - (s.start || 0));
      return Object.assign({}, base, {
        ts: ts(date), date, nick, src: unit, talkerUnits, talkerSys: talkerUnits ? sid : undefined,
        pos: s.start || 0, txDuration: len,
        duration: len ? fmtDuration(len) : base.duration,
        text: fmtTranscript(s.text), textMuted: false, _el: null,
      });
    });
  } else {
    lines = [Object.assign({}, base, { text: fmtTranscript(t.text || ''), textMuted: false, _el: null })];
  }
  replaceCallMessages(chanName, callMsgs, lines);
  return true;
}

/** Swap a call's messages in a channel for new ones, in place (the array and, when shown, the DOM). */
function replaceCallMessages(chanName, oldMsgs, newMsgs) {
  const ch = channels.get(chanName);
  if (!ch || oldMsgs.length === 0) return;
  const idx = ch.messages.indexOf(oldMsgs[0]);
  if (idx < 0) return;
  const drop = new Set(oldMsgs);
  ch.messages = ch.messages.filter(m => !drop.has(m));
  ch.messages.splice(idx, 0, ...newMsgs);

  if (chanName !== activeChannel) return;
  const anchor = oldMsgs[0]._el;
  if (!anchor || !anchor.parentNode) { reRenderChannel(chanName); return; }
  const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  const playing = oldMsgs.some(m => m._el && m._el === currentPlayingMsgEl);
  const frag = document.createDocumentFragment();
  newMsgs.forEach((m, i) => {
    const el = buildMsgEl(m);
    if (newMsgs.length > 1) {
      el.classList.add(i === 0 ? 'call-group-first' : i === newMsgs.length - 1 ? 'call-group-last' : 'call-group-mid');
    }
    m._el = el;
    frag.appendChild(el);
  });
  anchor.parentNode.insertBefore(frag, anchor);
  for (const m of oldMsgs) if (m._el) m._el.remove();
  if (playing && newMsgs[0]._el) {
    currentPlayingMsgEl = newMsgs[0]._el;
    currentPlayingMsgEl.classList.add('now-playing');
  }
  if (atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

/** Re-render the active channel's messages. */
function reRenderChannel(chanName) {
  const ch = channels.get(chanName);
  if (!ch || chanName !== activeChannel) return;
  const savedScroll = messagesEl.scrollTop;
  const wasAtBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  messagesEl.innerHTML = '';
  lastRenderedDateStr = '';
  for (const m of ch.messages) appendMsgDOM(m);
  if (wasAtBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  else messagesEl.scrollTop = savedScroll;
}

/** Apply any pending transcripts that arrived before their call's messages were rendered. */
function drainPendingTranscriptions(callIds) {
  for (const callId of callIds) {
    const pending = pendingTranscriptions.get(callId);
    if (pending) applyTranscript(pending);
  }
}

/** Fetch the transcripts of calls loaded from the recorder (history), by path, and apply them.
 *  The plugin takes up to 200 paths a request; 50 keep the URL short. */
const TRANSCRIPT_BATCH = 50;
let transcribeErrorShown = 0;

async function fetchTranscriptionsForCalls(paths) {
  const want = [...new Set((paths || []).filter(Boolean))];
  for (let i = 0; i < want.length; i += TRANSCRIPT_BATCH) {
    const batch = want.slice(i, i + TRANSCRIPT_BATCH);
    try {
      const data = await fetchTranscribe(`/api/v1/transcripts?paths=${batch.map(encodeURIComponent).join(',')}`);
      for (const t of (data.transcripts || [])) applyTranscript(t);
    } catch (err) {
      if (Date.now() - transcribeErrorShown > 60000) {
        transcribeErrorShown = Date.now();
        serverMsg(`Transcripts unavailable: ${err.message}`);
      }
      return;
    }
  }
}

/** Ensure a unit is in a channel's nicklist */
function ensureUserInChannel(ch, chanName, systemId, unitId, alphaTag) {
  const uk = unitKey(systemId, unitId);
  if (ch.users.has(uk)) {
    // Mark online if they're transmitting
    const u = ch.users.get(uk);
    if (u.online === false) { u.online = true; if (chanName === activeChannel) renderNicklist(); }
    return;
  }
  const nick = resolveNick(systemId, unitId, alphaTag);
  const role = roleForNick(nick);
  ch.users.set(uk, { nick, prefix: role === 'op' ? '@' : '', role, unitId, systemId, online: true });
  if (chanName === activeChannel) renderNicklist();
}

// ── Calls on the air (rec.calls, each status) ──
// "<CallView.id>:<talkgroup>" → { key, id, sys, tgid, chanName, startMs, sources, state, entry, preexisting, ... }
const liveCalls = new Map();
// Recorded calls that left the air before their recording (concluded) came: shown without audio until it does.
let awaitingPath = [];
// False until the first status after each hello: the calls on the air then are not new.
let syncedSinceHello = false;

function liveKey(c) { return `${c.id}:${c.talkgroup}`; }

/** The calls on the air now against those last time: new ones start, changed ones update, gone ones end. */
function syncCalls() {
  if (!bootstrapped) return;
  const calls = rec.calls || [];
  const nowS = rec.status ? rec.status.nowS : 0;
  const present = new Set(calls.map(liveKey));

  for (const [key, lc] of liveCalls) {
    if (present.has(key)) continue;
    liveCalls.delete(key);
    liveCallEnded(lc.id);
    endLiveCall(lc);
  }

  for (const c of calls) {
    const key = liveKey(c);
    let lc = liveCalls.get(key);
    if (!lc) {
      const sys = c.systemName || systemName(rec.status, c.system);
      lc = {
        key, id: c.id, sys, tgid: c.talkgroup,
        chanName: talkgroupChannel(sys, c.talkgroup, c.alphaTag),
        // Engine seconds → wall clock, once, when the call is first seen.
        startMs: Date.now() - Math.max(0, nowS - c.startS) * 1000,
        sources: [], entry: null, encMsg: null,
        // On the air when we connected: its start wasn't seen; its recording is shown when it comes.
        preexisting: !syncedSinceHello,
      };
      liveCalls.set(key, lc);
      startLiveCall(lc, c);
    }
    updateLiveCall(lc, c);
  }
  syncedSinceHello = true;

  // Give up on recordings that never came: a call shorter than the recorder's minimum call is deleted,
  // not saved, so its placeholder lines (no audio, ever) are taken back out.
  const cutoff = Date.now() - 20000;
  if (awaitingPath.length) {
    const gone = awaitingPath.filter(lc => lc.endedMs <= cutoff);
    if (gone.length) {
      awaitingPath = awaitingPath.filter(lc => lc.endedMs > cutoff);
      for (const lc of gone) dropUnsavedCall(lc);
    }
  }
}

/** Take out the placeholder lines of a live call that was never recorded (no path came for them). */
function dropUnsavedCall(lc) {
  let changed = false;
  for (const name of [lc.chanName, STARRED_CHANNEL, EMERGENCY_CHANNEL]) {
    const ch = channels.get(name);
    if (!ch) continue;
    const readAt = channelReadAt.get(name) || 0;
    let unread = 0;
    ch.messages = ch.messages.filter((m) => {
      if (m.callId !== lc.key || m.path) return true;
      if (m._el) m._el.remove();
      if (m._unreadAt && m._unreadAt > readAt) unread++;   // counted unread and not read since
      return false;
    });
    if (unread) {
      channelUnread.set(name, Math.max(0, (channelUnread.get(name) || 0) - unread));
      changed = true;
    }
  }
  if (changed) renderTree();
}

/** A call came on the air: the typing indicator, an emergency notice, an encrypted call's line. */
function startLiveCall(lc, c) {
  if (lc.preexisting) return;
  const ch = channels.get(lc.chanName);
  if (!ch) return;
  const first = (c.sources || [])[0];
  let srcNick = null;
  if (first != null) {
    srcNick = resolveNick(lc.sys, first, '');
    ensureUserInChannel(ch, lc.chanName, lc.sys, first, '');
  }

  // Show typing indicator for primary speaker
  if (srcNick && c.state === 'recording') showTyping(lc.chanName, srcNick);

  // Emergency handling
  if (c.emergency) {
    addMsg(lc.chanName, {
      ts: ts(), kind: 'notice', emergency: true,
      text: `*** EMERGENCY *** ${srcNick || 'unknown'} — emergency call on ${lc.chanName}`,
    });
  }

  // Encrypted call (and not being decrypted) — show immediately since we won't get transcript content
  if (c.encrypted && !c.decrypted) {
    lc.encMsg = {
      ts: ts(), date: new Date(), nick: srcNick || lc.chanName, encrypted: true,
      callId: lc.key, text: '[encrypted]',
    };
    addMsg(lc.chanName, lc.encMsg);
    clearTyping(lc.chanName);
  }

  renderTree();
}

/** A call on the air changed: new talkers join the nicklist and type. */
function updateLiveCall(lc, c) {
  lc.state = c.state;
  lc.encrypted = !!c.encrypted && !c.decrypted;
  lc.emergency = !!c.emergency;
  const srcs = c.sources || [];
  const added = srcs.filter(u => !lc.sources.includes(u));
  lc.sources = srcs.slice();
  if (lc.preexisting || lc.encrypted || c.state !== 'recording') return;
  const ch = channels.get(lc.chanName);
  if (!ch) return;
  for (const u of added) ensureUserInChannel(ch, lc.chanName, lc.sys, u, '');
  // Keep the indicator up for whoever talks last while the call is on the air.
  if (srcs.length > 0) showTyping(lc.chanName, resolveNick(lc.sys, srcs[srcs.length - 1], ''));
}

/** A call left the air: its message, from its recording when that came already, else a line per talker until it does. */
function endLiveCall(lc) {
  clearTyping(lc.chanName);
  if (lc.preexisting) return;
  const ch = channels.get(lc.chanName);
  if (!ch) return;

  if (lc.encMsg) {
    // Update the placeholder with the duration now that we know it
    lc.encMsg.text = `[encrypted, ${fmtDuration((Date.now() - lc.startMs) / 1000)}]`;
    if (lc.chanName === activeChannel) refreshMsgEl(lc.encMsg);
    return;
  }
  // Followed but not recorded (ignored, unknown talkgroup, no recorder free): nothing to show.
  if (lc.state !== 'recording') return;

  if (lc.entry) { renderEntry(lc.entry, lc.chanName); return; }

  const date = new Date(lc.startMs);
  const talkers = lc.sources.length ? lc.sources : [null];
  for (const u of talkers) {
    addMsg(lc.chanName, {
      ts: ts(date), date,
      nick: u != null ? resolveNick(lc.sys, u, '') : lc.chanName, src: u,
      callId: lc.key, channel: lc.chanName, emergency: lc.emergency,
      systemId: lc.sys, callStart: lc.startMs, talkers: lc.sources.slice(),
    });
  }
  lc.endedMs = Date.now();
  awaitingPath.push(lc);
}

/** A call was recorded (concluded): it gives its live call's messages their path, or is shown as it is. */
function handleConcluded(entry) {
  if (!bootstrapped || !entry || !entry.record) return;
  const r = entry.record;
  // Another site's copy of a call shown already.
  if (isDuplicateCopy(entry)) return;
  const sys = r.short_name;
  const chanName = talkgroupChannel(sys, r.talkgroup, r.talkgroup_tag);
  const loaded = channelLoadedCallIds.get(chanName);
  if (loaded && loaded.has(entry.path)) return;

  // Its live call: same system and talkgroup, started within 3 s. The first match wins.
  const startMs = r.start_time_ms || (r.start_time || 0) * 1000;
  const near = lc => !lc.preexisting && !lc.entry && lc.sys === sys && lc.tgid === r.talkgroup && Math.abs(lc.startMs - startMs) <= 3000;
  for (const lc of liveCalls.values()) {
    if (near(lc)) { lc.entry = entry; return; } // shown when it leaves the air
  }
  const i = awaitingPath.findIndex(near);
  if (i >= 0) {
    const lc = awaitingPath.splice(i, 1)[0];
    lc.entry = entry;
    upgradeLiveMessages(lc, entry);
    return;
  }
  renderEntry(entry, chanName);
}

/** A recorded call's messages, appended to its channel. */
function renderEntry(entry, chanName) {
  const call = entryToCall(entry);
  const msgs = callsToMessages([call], chanName, call.system_id);
  for (const m of msgs) addMsg(chanName, m);
  drainPendingTranscriptions([call.call_id]);
  enqueueRecorded(call, chanName, msgs);
}

/** A live call's lines (no audio yet) replaced by its recording's, in its channel and the starred channel. */
function upgradeLiveMessages(lc, entry) {
  const chanName = lc.chanName;
  const ch = channels.get(chanName);
  if (!ch) return;
  const call = entryToCall(entry);
  const newMsgs = callsToMessages([call], chanName, call.system_id);
  const old = ch.messages.filter(m => m.callId === lc.key);
  // Emergency holds the placeholder lines even when its channel doesn't (a talkgroup ignored here).
  const em = channels.get(EMERGENCY_CHANNEL);
  const oldEm = em ? em.messages.filter(m => m.callId === lc.key) : [];
  const st = channels.get(STARRED_CHANNEL);
  const oldStarred = st ? st.messages.filter(m => m.callId === lc.key) : [];
  if (old.length) replaceCallMessages(chanName, old, newMsgs);
  // Not in its channel (cleared, or ignored here): added there, but where its placeholders were forwarded
  // they are replaced below, not added again.
  else for (const m of newMsgs) addMsg(chanName, m, oldEm.length > 0 || oldStarred.length > 0);
  if (oldStarred.length) {
    replaceCallMessages(STARRED_CHANNEL, oldStarred, newMsgs.map(m => Object.assign({}, m, { originChannel: chanName, _el: null })));
  }
  if (oldEm.length) replaceCallMessages(EMERGENCY_CHANNEL, oldEm, newMsgs.map(m => Object.assign({}, m, { originChannel: chanName, _el: null })));
  drainPendingTranscriptions([call.call_id]);
  enqueueRecorded(call, chanName, newMsgs);
}

/** Scanner: queue a recorded call for auto-play if its channel is scanned. */
function enqueueRecorded(call, chanName, msgs) {
  if (isIgnored(chanName)) return;
  if (call.encrypted || !call.audio || msgs.length === 0 || !msgs[0].path) return;
  scannerEnqueue(call.path, msgs[0].nick, chanName, call.emergency);
}

/** A radio affiliated with a talkgroup (monitorEvent unitAffiliated, topic activity): it parts its
 *  old channel and joins the new one. */
function handleAffiliation(evt) {
  const systemId = evt.system;
  const unitId = evt.unit;
  const tgid = evt.talkgroup;
  if (!systemId || unitId == null || tgid == null) return;

  // Dedup: same system+unit+talkgroup within 10s (several sites hear one affiliation)
  const dk = `${systemId}:${unitId}:aff:${tgid}`;
  const now = Date.now();
  if (liveUnitDedup.has(dk) && now - liveUnitDedup.get(dk) < 10000) return;
  liveUnitDedup.set(dk, now);
  if (liveUnitDedup.size > 200) {
    for (const [k, t] of liveUnitDedup) { if (now - t > 15000) liveUnitDedup.delete(k); }
  }

  const nick = resolveNick(systemId, unitId, evt.alias || '');
  const chanName = talkgroupChannel(systemId, tgid, evt.alphaTag);
  const ch = channels.get(chanName);
  if (!ch) return;
  const jk = unitKey(systemId, unitId);

  // Part the channel it was affiliated with
  const oldChan = unitAffChannel.get(jk);
  if (oldChan && oldChan !== chanName && channels.has(oldChan)) {
    const oc = channels.get(oldChan);
    if (oc.users.delete(jk)) {
      addMsg(oldChan, { ts: ts(), kind: 'part', text: `${nick} has left ${oldChan}` });
      if (oldChan === activeChannel) renderNicklist();
    }
  }
  unitAffChannel.set(jk, chanName);

  // Talkgroup affiliation → IRC JOIN
  const u = ch.users.get(jk);
  if (!u || !u.affiliated) {
    const role = roleForNick(nick);
    ch.users.set(jk, { nick, prefix: role === 'op' ? '@' : '', role, unitId, systemId, affiliated: true, online: true });
    addMsg(chanName, {
      ts: ts(), kind: 'join',
      text: `${nick} has joined ${chanName}${ch.tag ? ' [' + ch.tag + ']' : ''}`,
    });
  } else {
    u.online = true;
  }
  if (chanName === activeChannel || activeChannel === STARRED_CHANNEL) renderNicklist();
}


// ══════════════════════════════════════════════════════════════
// INPUT HANDLING — IRC commands
// ══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    jumpUnread(e.key === 'ArrowDown' ? 1 : -1);
    return;
  }
  if (e.key === '/' && document.activeElement !== inputField) {
    e.preventDefault();
    inputField.focus();
    inputField.value = '/';
  }
});

// Nick tooltip on hover in chat messages (event delegation)
messagesEl.addEventListener('mouseover', (e) => {
  const nickEl = e.target.closest('.nick[data-nick]');
  if (nickEl && nickEl.dataset.nick) showNickTooltip(nickEl.dataset.nick, nickEl);
});
messagesEl.addEventListener('mouseout', (e) => {
  const nickEl = e.target.closest('.nick[data-nick]');
  if (nickEl) hideNickTooltip();
});

inputField.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const val = inputField.value.trim();
  inputField.value = '';
  if (!val) return;

  if (val.startsWith('/')) {
    handleCommand(val);
  } else {
    // Read-only: can't send messages to radio channels
    addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'This client is read-only (listen access). Messages cannot be sent.' });
  }
});

function handleCommand(cmd) {
  const parts = cmd.split(/\s+/);
  const c = parts[0].toLowerCase();

  switch (c) {
    case '/j':
    case '/join': {
      const target = parts[1];
      if (!target) { addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Usage: /join #channel' }); break; }
      const raw = target.startsWith('#') ? target.slice(1) : target;
      const match = fuzzyMatchChannel(raw);
      if (match) {
        switchChannel(match);
      } else {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `No such channel: #${raw}` });
      }
      break;
    }

    case '/part':
    case '/leave': {
      switchChannel(STATUS_CHANNEL);
      break;
    }

    case '/list':
    case '/channels': {
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '— Channel list —' });
      for (const [name, ch] of channels) {
        if (name === STATUS_CHANNEL) continue;
        addMsg(activeChannel, {
          ts: ts(), kind: 'notice',
          text: `  ${name}  (${ch.users.size} users) — ${ch.description || ch.alpha_tag}`,
        });
      }
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `— End of /list — ${channels.size - 1} channels` });
      break;
    }

    case '/who':
    case '/names': {
      const target = parts[1] || activeChannel;
      let ch = channels.get(target);
      if (!ch) {
        // Fuzzy
        for (const [name, c] of channels) {
          if (name.toLowerCase().includes(target.toLowerCase())) { ch = c; break; }
        }
      }
      if (!ch) { addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `No such channel: ${target}` }); break; }
      const nicks = [...ch.users.values()].map(u => `${u.prefix}${u.nick}`).join(' ');
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `[${target}] ${nicks || '(empty)'}` });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `— End of /NAMES — ${ch.users.size} total` });
      break;
    }

    case '/topic': {
      const ch = channels.get(activeChannel);
      if (ch) {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Topic for ${activeChannel}: ${ch.description || ch.alpha_tag}` });
      }
      break;
    }

    case '/whois': {
      const target = parts[1];
      if (!target) { addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Usage: /whois <nick>' }); break; }
      const lower = target.toLowerCase();
      const onChans = [];
      for (const [name, ch] of channels) {
        for (const u of ch.users.values()) {
          if (u.nick.toLowerCase() === lower) { onChans.push(name); break; }
        }
      }
      if (onChans.length > 0) {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `[${target}] is on channels: ${onChans.join(' ')}` });
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `[${target}] connected via Trunk Recorder Pro${rec.version ? ' ' + rec.version : ''}` });
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `— End of /WHOIS —` });
      } else {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `No such nick: ${target}` });
      }
      break;
    }

    case '/fav':
    case '/favorite': {
      if (activeChannel === STATUS_CHANNEL) {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Cannot favorite *status' });
        break;
      }
      toggleFavorite(activeChannel);
      addMsg(activeChannel, { ts: ts(), kind: 'notice',
        text: isFavorite(activeChannel)
          ? `Added ${activeChannel} to favorites`
          : `Removed ${activeChannel} from favorites` });
      break;
    }

    case '/scan': {
      if (activeChannel === STATUS_CHANNEL) {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Cannot scan *status' });
        break;
      }
      toggleScan(activeChannel);
      addMsg(activeChannel, { ts: ts(), kind: 'notice',
        text: (isScanned(activeChannel)
          ? `Added ${activeChannel} to scan list`
          : `Removed ${activeChannel} from scan list`)
          + (liveListening ? " (the scanner's auto-play is paused while live listening is on)" : '') });
      break;
    }
    case '/scanner': {
      scannerEnabled = !scannerEnabled;
      localStorage.setItem('irc_scanner_enabled', scannerEnabled ? '1' : '0');
      updateScannerUI();
      addMsg(activeChannel, { ts: ts(), kind: 'notice',
        text: `Scanner ${scannerEnabled ? 'enabled' : 'disabled'}`
          + (scannerEnabled && liveListening ? ' (its auto-play is paused while live listening is on)' : '') });
      break;
    }

    case '/listen': {
      const arg = (parts[1] || '').toLowerCase();
      if ((!arg && liveListening) || arg === 'off' || arg === 'stop') {
        const wasOn = liveListening;
        stopListening();
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: wasOn ? 'Live listening off' : 'Live listening is not on' });
      } else if (!arg) {
        startListening();
      } else if (LISTEN_MODES.includes(arg)) {
        setListenMode(arg);
        if (!liveListening) startListening();
        else addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Listening live (${listenMode}): ${describeWanted()}` });
      } else {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Usage: /listen [channel|starred|scan|off]' });
      }
      break;
    }

    case '/volume':
    case '/vol': {
      if (parts[1] == null || !/^\d+$/.test(parts[1])) {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Volume: ${listenVolume} (usage: /volume 0-100)` });
        break;
      }
      setLiveVolume(parts[1]);
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Volume: ${listenVolume}` });
      break;
    }

    case '/ops': {
      const opArgs = parts.slice(1).join(' ').trim();
      if (!opArgs) {
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Op patterns: ${getOpPatterns()}` });
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Usage: /ops <pattern1>,<pattern2>,... (regex, comma-separated)' });
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '/ops reset — restore defaults' });
      } else if (opArgs === 'reset') {
        localStorage.removeItem('op_patterns');
        opRegex = buildOpRegex(DEFAULT_OP_PATTERNS);
        reapplyRoles();
        addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Op patterns reset to: ${DEFAULT_OP_PATTERNS}` });
      } else {
        try {
          const testRe = buildOpRegex(opArgs);
          testRe.test('test'); // validate
          localStorage.setItem('op_patterns', opArgs);
          opRegex = testRe;
          reapplyRoles();
          addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Op patterns set to: ${opArgs}` });
        } catch (e) {
          addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Invalid regex: ${e.message}` });
        }
      }
      break;
    }

    case '/ignore':
    case '/unignore': {
      const off = c === '/unignore';
      const rec2 = parts[1] === 'recorder' || parts[1] === 'rec';
      if (!channelKey(activeChannel)) { addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Join a talkgroup channel first' }); break; }
      if (rec2) setIgnoreRecorder(activeChannel, !off);
      else if (isIgnoredLocal(activeChannel) !== !off) toggleIgnoreLocal(activeChannel);
      break;
    }

    case '/sync':
      syncCommand(parts[1], parts[2]);
      break;

    case '/readall':
      markAllRead();
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'All channels marked as read' });
      break;

    case '/clear':
      if (activeChannel === EMERGENCY_CHANNEL) { clearEmergency(); break; }
      if (channels.has(activeChannel)) {
        channels.get(activeChannel).messages = [];
        messagesEl.innerHTML = '';
        lastRenderedDateStr = '';
      }
      break;

    case '/reconnect':
      // The recorder's connection reconnects by itself; this reopens the transcript stream.
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Recorder: ${rec.connected ? 'connected' : 'reconnecting'} (it reconnects by itself)` });
      connectTranscripts();
      break;

    case '/api': {
      const arg = parts[1];
      if (arg === 'reset') {
        localStorage.removeItem('irc_transcribe');
        TRANSCRIBE_BASE = TRANSCRIBE_DEFAULT;
        connectTranscripts();
      } else if (arg) {
        if (!cleanHttpBase(arg)) {
          addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Usage: /api http://host:port — the transcribe plugin\'s address; /api reset — the default' });
          break;
        }
        TRANSCRIBE_BASE = cleanHttpBase(arg);
        localStorage.setItem('irc_transcribe', TRANSCRIBE_BASE);
        connectTranscripts();
      }
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Recorder: ${rec.httpBase} (${rec.connected ? 'connected' : 'not connected'}${rec.version ? ', ' + rec.version : ''})` });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Transcripts: ${TRANSCRIBE_BASE} (${transcriptState})${TRANSCRIBE_BASE === TRANSCRIBE_DEFAULT ? ' — the default' : ''}` });
      if (!arg) addMsg(activeChannel, { ts: ts(), kind: 'notice', text: 'Set it with /api http://host:port, or ?transcribe= in the URL; /api reset for the default' });
      break;
    }

    case '/stats': {
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '— Stats —' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `  Channels: ${channels.size - 1}` });
      let totalU = 0;
      const uniqueNicks = new Set();
      for (const ch of channels.values()) {
        for (const u of ch.users.values()) uniqueNicks.add(u.nick);
        totalU += ch.users.size;
      }
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `  Unique users: ${uniqueNicks.size}` });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `  Total affiliations: ${totalU}` });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `  Active calls: ${liveCalls.size}` });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `  Connection: ${connectionState}` });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `  Transcripts: ${transcriptState}` });
      // The recorder's radio registry: what it has heard of each system
      const statsChan = activeChannel;
      queryRadio({ what: 'summary' })
        .then(res => {
          if (res.error) throw new Error(res.error);
          for (const [sys, s] of Object.entries(res.systems || {})) {
            const name = systemNames.get(sys) || sys;
            addMsg(statsChan, { ts: ts(), kind: 'notice', text: `  ${name}: ${s.talkgroups} talkgroups heard (${s.tgs24h} in 24 h), ${s.units} radios (${s.units1h} in the last hour, ${s.units24h} in 24 h, ${s.newUnits24h} new)` });
          }
        })
        .catch(err => addMsg(statsChan, { ts: ts(), kind: 'notice', text: `  Radio registry: ${err.message}` }))
        .finally(() => addMsg(statsChan, { ts: ts(), kind: 'notice', text: '— End of /stats —' }));
      break;
    }

    case '/nerd': {
      const enabled = document.documentElement.classList.toggle('nerd');
      localStorage.setItem('nerd_mode', enabled ? '1' : '0');
      addMsg(activeChannel, { ts: ts(), kind: 'notice',
        text: `Hipster nerd cool mode ${enabled ? 'enabled ✨' : 'disabled'}` });
      break;
    }

    case '/help':
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '— Commands —' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /j, /join #channel  — Switch to channel (fuzzy match)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /part               — Switch to *status' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /list               — List all channels' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /who, /names        — List users in channel' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /whois <nick>       — User info' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /topic              — Show channel topic' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /stats              — Connection, channel and radio stats' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /fav                — Toggle favorite on current channel' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /scan               — Toggle scanner on current channel' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /scanner            — Toggle scanner mode on/off (auto-play paused while listening live)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /listen             — Toggle live listening (the LISTEN button)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /listen channel|starred|scan — Hear this channel / it and the favourites / it and the scan list' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /listen off         — Stop live listening' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /volume N           — Live volume, 0-100' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /ops [patterns]     — View/set op nick patterns (comma-sep regex)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /ignore [recorder]  — Hide this talkgroup here (or tell the recorder to ignore it); /unignore undoes' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /sync [on|off|status|push|pull] — Name sync with the recorder (needs control access)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /readall            — Mark all channels as read' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /reconnect          — Reconnect the transcript stream' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /clear              — Clear scrollback (in Emergency: dismiss the channel)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /api [url|reset]    — Show or set the transcribe plugin\'s address' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '  /nerd               — Toggle hipster nerd cool mode (small text, low contrast)' });
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: '— End of /help —' });
      break;

    default:
      addMsg(activeChannel, { ts: ts(), kind: 'notice', text: `Unknown command: ${c}` });
  }
}

// AUDIO PLAYER
// ══════════════════════════════════════════════════════════════

const playerBar = document.getElementById('player-bar');
const playerPlayBtn = document.getElementById('player-play');
const playerNickEl = document.getElementById('player-nick');
const playerChanEl = document.getElementById('player-chan');
const playerTimeEl = document.getElementById('player-time');
const playerProgress = document.getElementById('player-progress');
const playerProgressFill = document.getElementById('player-progress-fill');
const playerCloseBtn = document.getElementById('player-close');

const audioEl = new Audio();
audioEl.preload = 'auto';
let currentPlayingMsgEl = null;
let currentCallId = null;
let playerRaf = null;
let playerTxEnd = null; // end position for current transmission segment (seconds), null = play full call

function fmtAudioTime(sec) {
  if (!sec || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

/** Render segment markers on the progress bar from a call's src_list. */
function renderPlayerSegments(callId) {
  // Clear existing segments
  playerProgress.querySelectorAll('.player-segment, .player-segment-divider').forEach(el => el.remove());
  const srcList = callSrcLists.get(callId);
  if (!srcList || srcList.length < 2 || !audioEl.duration) return;

  const dur = audioEl.duration;
  const colors = ['var(--irc-info)', 'var(--irc-success)', 'var(--magenta)', 'var(--yellow)', 'var(--red)', 'var(--blue)'];
  const sorted = [...srcList].sort((a, b) => (a.pos || 0) - (b.pos || 0));

  // Track unique sources for color assignment
  const srcColorMap = new Map();
  let colorIdx = 0;
  for (const tx of sorted) {
    if (!srcColorMap.has(tx.src)) srcColorMap.set(tx.src, colors[colorIdx++ % colors.length]);
  }

  for (let i = 0; i < sorted.length; i++) {
    const tx = sorted[i];
    const startPct = ((tx.pos || 0) / dur) * 100;
    const txDur = tx.duration || (i < sorted.length - 1 ? (sorted[i + 1].pos || 0) - (tx.pos || 0) : dur - (tx.pos || 0));
    const widthPct = (txDur / dur) * 100;

    // Colored segment background
    const seg = document.createElement('div');
    seg.className = 'player-segment';
    seg.style.left = startPct + '%';
    seg.style.width = Math.max(widthPct, 0.5) + '%';
    seg.style.background = srcColorMap.get(tx.src);
    seg.dataset.txIndex = i;
    playerProgress.appendChild(seg);

    // Divider line between segments (skip first)
    if (i > 0 && startPct > 0) {
      const div = document.createElement('div');
      div.className = 'player-segment-divider';
      div.style.left = startPct + '%';
      playerProgress.appendChild(div);
    }
  }
}

/** Highlight the active segment in the progress bar. */
function updateActiveSegment() {
  const t = audioEl.currentTime;
  playerProgress.querySelectorAll('.player-segment').forEach(seg => {
    seg.classList.remove('active');
  });
  const srcList = callSrcLists.get(currentCallId);
  if (!srcList || !audioEl.duration) return;
  const sorted = [...srcList].sort((a, b) => (a.pos || 0) - (b.pos || 0));
  for (let i = sorted.length - 1; i >= 0; i--) {
    if (t >= (sorted[i].pos || 0)) {
      const seg = playerProgress.querySelector(`.player-segment[data-tx-index="${i}"]`);
      if (seg) seg.classList.add('active');
      break;
    }
  }
}

function playCall(callId, nick, channel, msgEl, txPos, txDuration) {
  const hasTxPos = txPos != null && txPos >= 0;
  const txEnd = hasTxPos && txDuration > 0 ? txPos + txDuration : null;

  // Same call — seek to segment or toggle pause
  if (currentCallId === callId && audioEl.src) {
    if (hasTxPos) {
      // Clicking a different transmission in the same call — seek to it
      playerTxEnd = txEnd;
      audioEl.currentTime = txPos;
      // Update highlight
      if (currentPlayingMsgEl) currentPlayingMsgEl.classList.remove('now-playing');
      currentPlayingMsgEl = msgEl;
      if (msgEl) msgEl.classList.add('now-playing');
      playerNickEl.textContent = nick || '?';
      playerNickEl.style.color = nickColor(nick || '');
      if (audioEl.paused) {
        audioEl.play().then(() => {
          playerPlayBtn.textContent = '⏸';
          updatePlayerProgress();
        }).catch(() => { playerPlayBtn.textContent = '▶'; });
      }
      return;
    }
    // No specific transmission — toggle pause
    if (!audioEl.paused) {
      audioEl.pause();
      playerPlayBtn.textContent = '▶';
      return;
    }
    playerTxEnd = null; // resume full playback
    audioEl.play().then(() => {
      playerPlayBtn.textContent = '⏸';
      updatePlayerProgress();
    }).catch(() => { playerPlayBtn.textContent = '▶'; });
    return;
  }

  // New call — load and play
  currentCallId = callId;
  playerTxEnd = txEnd;

  // Clear previous highlight
  if (currentPlayingMsgEl) currentPlayingMsgEl.classList.remove('now-playing');
  currentPlayingMsgEl = msgEl;
  if (msgEl) msgEl.classList.add('now-playing');

  // Update player bar
  playerNickEl.textContent = nick || '?';
  playerNickEl.style.color = nickColor(nick || '');
  playerChanEl.textContent = channel || '';
  playerTimeEl.textContent = '0:00 / --:--';
  playerProgressFill.style.width = '0%';
  playerBar.classList.add('active');
  playerPlayBtn.textContent = '⏳';

  // Clear old segments
  playerProgress.querySelectorAll('.player-segment, .player-segment-divider').forEach(el => el.remove());

  // Load audio — the recorded call's file from the recorder (callId is its path), each segment URL-encoded
  audioEl.src = `/calls/${String(callId).split('/').map(encodeURIComponent).join('/')}.wav`;
  audioEl.load();

  // Seek to transmission start once metadata loaded
  const onCanPlay = () => {
    audioEl.removeEventListener('canplay', onCanPlay);
    if (hasTxPos) audioEl.currentTime = txPos;
    renderPlayerSegments(callId);
  };
  audioEl.addEventListener('canplay', onCanPlay);

  audioEl.play().then(() => {
    playerPlayBtn.textContent = '⏸';
    updatePlayerProgress();
  }).catch(err => {
    playerPlayBtn.textContent = '▶';
    playerTimeEl.textContent = err.name === 'NotAllowedError' ? 'click to play' : 'no audio';
    console.warn('Playback error:', err.message);
  });
}

function updatePlayerProgress() {
  if (playerRaf) cancelAnimationFrame(playerRaf);

  function tick() {
    if (!audioEl.paused && audioEl.duration) {
      // Stop at transmission end if set
      if (playerTxEnd != null && audioEl.currentTime >= playerTxEnd) {
        audioEl.pause();
        audioEl.currentTime = playerTxEnd;
        playerPlayBtn.textContent = '▶';
        playerTxEnd = null; // allow manual resume to play full call
        return;
      }
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      playerProgressFill.style.width = pct + '%';
      playerTimeEl.textContent = `${fmtAudioTime(audioEl.currentTime)} / ${fmtAudioTime(audioEl.duration)}`;
      updateActiveSegment();
    }
    if (!audioEl.paused) playerRaf = requestAnimationFrame(tick);
  }
  tick();
}

// Play/pause button
playerPlayBtn.addEventListener('click', () => {
  if (!audioEl.src) return;
  if (audioEl.paused) {
    audioEl.play().then(() => {
      playerPlayBtn.textContent = '⏸';
      updatePlayerProgress();
    }).catch(() => { playerPlayBtn.textContent = '▶'; });
  } else {
    audioEl.pause();
    playerPlayBtn.textContent = '▶';
  }
});

// Close player
playerCloseBtn.addEventListener('click', () => {
  audioEl.pause();
  audioEl.src = '';
  currentCallId = null;
  playerTxEnd = null;
  if (currentPlayingMsgEl) currentPlayingMsgEl.classList.remove('now-playing');
  currentPlayingMsgEl = null;
  playerBar.classList.remove('active');
  playerProgress.querySelectorAll('.player-segment, .player-segment-divider').forEach(el => el.remove());
  if (playerRaf) cancelAnimationFrame(playerRaf);
  // Reset scanner state so queue can resume on next enqueue
  scannerPlaying = false;
  updateScannerQueueUI();
});

// Skip button — advance to next scanner item
document.getElementById('player-skip').addEventListener('click', () => {
  audioEl.pause();
  audioEl.src = '';
  playerPlayBtn.textContent = '\u25B6';
  if (currentPlayingMsgEl) currentPlayingMsgEl.classList.remove('now-playing');
  currentPlayingMsgEl = null;
  currentCallId = null;
  if (scannerEnabled && scannerQueue.length > 0) {
    setTimeout(scannerPlayNext, 300);
  } else {
    scannerPlaying = false;
    updateScannerQueueUI();
  }
});

// Seek on progress bar click
playerProgress.addEventListener('click', (e) => {
  if (!audioEl.duration) return;
  const rect = playerProgress.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = pct * audioEl.duration;
  playerProgressFill.style.width = (pct * 100) + '%';
  playerTxEnd = null; // manual seek clears transmission boundary
});

// Audio ended
audioEl.addEventListener('ended', () => {
  playerPlayBtn.textContent = '▶';
  playerProgressFill.style.width = '100%';
  if (currentPlayingMsgEl) currentPlayingMsgEl.classList.remove('now-playing');
  currentPlayingMsgEl = null;
  currentCallId = null;

  // Scanner: play next in queue
  if (scannerEnabled && scannerQueue.length > 0) {
    setTimeout(scannerPlayNext, 300); // small gap between transmissions
  } else {
    scannerPlaying = false;
    updateScannerQueueUI();
  }
});

// Audio error — skip failed audio so scanner doesn't stall
audioEl.addEventListener('error', () => {
  playerPlayBtn.textContent = '\u25B6';
  if (currentPlayingMsgEl) currentPlayingMsgEl.classList.remove('now-playing');
  currentPlayingMsgEl = null;
  currentCallId = null;
  if (scannerEnabled && scannerQueue.length > 0) {
    setTimeout(scannerPlayNext, 300);
  } else {
    scannerPlaying = false;
    updateScannerQueueUI();
  }
});

// Duration loaded
audioEl.addEventListener('loadedmetadata', () => {
  playerTimeEl.textContent = `0:00 / ${fmtAudioTime(audioEl.duration)}`;
});

const channelTree = document.querySelector('.channel-tree');
const nicklist = document.querySelector('.nicklist');
const drawerBackdrop = document.getElementById('drawer-backdrop');
const hamburgerBtn = document.getElementById('mobile-hamburger');
const usersBtn = document.getElementById('mobile-users-btn');

function openDrawer(which) {
  if (which === 'channels') {
    channelTree.classList.add('open');
    nicklist.classList.remove('open');
  } else {
    nicklist.classList.add('open');
    channelTree.classList.remove('open');

  channelTree.classList.remove('open');
  nicklist.classList.remove('open');

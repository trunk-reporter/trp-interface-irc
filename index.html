function groupLabelHtml(name) {
  // Split into county prefix and category; only allow line-break between them
  const m = name.match(/^(.*?\(\d+\))\s(.+)$/);
  if (m) return `<span class="nb">${esc(m[1])}</span> <wbr><span class="nb">${esc(m[2])}</span>`;
  return esc(name);
}

function createChannelItem(ch) {
  const el = document.createElement('div');
  const unread = channelUnread.get(ch) || 0;
  el.className = 'channel-item' + (ch === activeChannel ? ' active' : '') + (unread > 0 && ch !== activeChannel ? ' has-activity' : '') + (isAudible(ch) ? ' audible' : '');

  const isEmergency = ch === EMERGENCY_CHANNEL;
  const isStarred = ch === STARRED_CHANNEL || isEmergency;   // meta channels: no per-channel icons
  if (isEmergency) el.classList.add('emergency-chan');

  const prefix = document.createElement('span');
  prefix.className = 'chan-prefix';
  prefix.textContent = isEmergency ? '\u26A0' : (isStarred ? '\u2605' : '#');
  el.appendChild(prefix);

  const label = document.createElement('span');
  label.className = 'chan-label';
  label.textContent = isEmergency ? 'Emergency' : (isStarred ? 'Starred' : ch.slice(1));
  el.appendChild(label);

  if (unread > 0 && ch !== activeChannel) {
    const badge = document.createElement('span');
    badge.className = 'unread';
    badge.textContent = unread > 99 ? '99+' : unread;
    el.appendChild(badge);
  }

  // Right-aligned cluster for icons (skip for starred meta-channel)
  if (!isStarred) {
    const rightCluster = document.createElement('span');
    rightCluster.className = 'channel-icons';

    // Scan icon
    const scanIcon = document.createElement('span');
    scanIcon.className = 'scan-icon' + (isScanned(ch) ? ' active' : '');
    scanIcon.textContent = isScanned(ch) ? '\uD83D\uDCE1' : '\uD83D\uDD07';
    scanIcon.title = isScanned(ch) ? 'Remove from scanner' : 'Add to scanner';
    scanIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleScan(ch);
    });
    rightCluster.appendChild(scanIcon);

    // Ignore here (and, with Sync on, on the recorder)
    const ign = document.createElement('span');
    ign.className = 'ign-icon';
    ign.textContent = '\uD83D\uDEAB';
    ign.title = 'Ignore here (hide it in this browser)';
    ign.addEventListener('click', (e) => { e.stopPropagation(); toggleIgnoreLocal(ch); });
    rightCluster.appendChild(ign);
    if (syncOn()) {
      const ignRec = document.createElement('span');
      ignRec.className = 'ign-icon';
      ignRec.textContent = '\u26D4';
      ignRec.title = 'Ignore on the recorder (it stops recording this talkgroup for everyone)';
      ignRec.addEventListener('click', (e) => { e.stopPropagation(); setIgnoreRecorder(ch, true); });
      rightCluster.appendChild(ignRec);
    }

    // Favorite star
    const star = document.createElement('span');
    star.className = 'fav-star' + (isFavorite(ch) ? ' active' : '');
    star.textContent = isFavorite(ch) ? '\u2605' : '\u2606';
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(ch);
    });
    rightCluster.appendChild(star);

    el.appendChild(rightCluster);
  }

  el.addEventListener('click', () => switchChannel(ch));
  return el;
}

let treeFrame = 0;
function renderTree() {
  if (treeFrame) return;
  treeFrame = requestAnimationFrame(() => { treeFrame = 0; renderTreeNow(); });
}

/** Channels with unread messages, newest first (the Starred meta-channel and status are left out: they repeat or add noise). */
function unreadEntries() {
  return unreadList(channelUnread, channelLastMsgTs).filter(e => !isMetaChannel(e.name) && channels.has(e.name) && !isIgnored(e.name));
}

function updateTabTitle() {
  document.title = tabTitle(unreadEntries().reduce((n, e) => n + e.count, 0) + (channelUnread.get(EMERGENCY_CHANNEL) || 0), 'Radio IRC');
}

/** Jump to the next (dir 1) or previous (dir -1) channel with unread messages. */
function jumpUnread(dir) {
  const next = stepUnread(unreadEntries().map(e => e.name), activeChannel, dir);
  if (next) switchChannel(next);
}

function renderTreeNow() {
  updateTabTitle();
  updateIgnoreBar();
  // Group channels by group field
  const groups = new Map();
  for (const [name, ch] of channels) {
    if (isMetaChannel(name) || isIgnored(name)) continue;
    const g = ch.group || 'Ungrouped';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(name);
  }

  treeScroll.innerHTML = '';

  // If searching, show flat filtered results
  if (treeSearchQuery) {
    const matches = [];
    for (const [name, ch] of channels) {
      if (name === STATUS_CHANNEL || isIgnored(name)) continue;
      const searchable = (name + ' ' + (ch.alpha_tag || '') + ' ' + (ch.group || '')).toLowerCase();
      if (searchable.includes(treeSearchQuery)) matches.push(name);
    }
    matches.sort();
    for (const ch of matches) {
      treeScroll.appendChild(createChannelItem(ch));
    }
    if (matches.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'tree-more';
      empty.textContent = 'No matching channels';
      treeScroll.appendChild(empty);
    }
    return; // skip grouped rendering
  }

  // Status channel first
  const sysSection = document.createElement('div');
  sysSection.className = 'tree-section';
  const sysLabel = document.createElement('div');
  sysLabel.className = 'tree-section-label';
  sysLabel.textContent = 'System';
  sysSection.appendChild(sysLabel);

  const statusItem = document.createElement('div');
  statusItem.className = 'channel-item' + (activeChannel === STATUS_CHANNEL ? ' active' : '');
  statusItem.innerHTML = `<span class="chan-prefix">*</span><span class="chan-label">status</span>`;
  if (channelUnread.get(STATUS_CHANNEL) > 0 && activeChannel !== STATUS_CHANNEL) {
    statusItem.classList.add('has-activity');
  }
  statusItem.addEventListener('click', () => switchChannel(STATUS_CHANNEL));
  sysSection.appendChild(statusItem);
  treeScroll.appendChild(sysSection);

  // Unread: only the channels with unread messages, newest first
  const unreadNow = unreadEntries();
  if (unreadNow.length > 0) {
    const total = unreadNow.reduce((n, e) => n + e.count, 0);
    const unSection = document.createElement('div');
    unSection.className = 'tree-section unread-section';
    const unLabel = document.createElement('div');
    unLabel.className = 'tree-section-label unread-label' + (unreadCollapsed ? ' collapsed' : '');
    const unText = document.createElement('span');
    unText.textContent = `Unread \u00b7 ${total > 99 ? '99+' : total} in ${unreadNow.length}`;
    unText.title = 'Click to fold or unfold. Alt+Down / Alt+Up: next / previous unread channel';
    const unRead = document.createElement('button');
    unRead.className = 'read-all-btn';
    unRead.textContent = 'Read All';
    unRead.addEventListener('click', (e) => { e.stopPropagation(); markAllRead(); });
    unLabel.addEventListener('click', () => {
      unreadCollapsed = !unreadCollapsed;
      try { localStorage.setItem('irc_unread_collapsed', unreadCollapsed ? '1' : '0'); } catch { /* storage blocked */ }
      renderTree();
    });
    unLabel.appendChild(unText);
    unLabel.appendChild(unRead);
    unSection.appendChild(unLabel);
    if (!unreadCollapsed) for (const e of unreadNow) unSection.appendChild(createChannelItem(e.name));
    treeScroll.appendChild(unSection);
  }

  // Emergency: appears once an emergency call has been seen
  if (channels.has(EMERGENCY_CHANNEL)) {
    const emSection = document.createElement('div');
    emSection.className = 'tree-section';
    emSection.appendChild(createChannelItem(EMERGENCY_CHANNEL));
    treeScroll.appendChild(emSection);
  }

  // Favorites section (with starred meta-channel at top)
  const favChans = [...channels.keys()].filter(ch => ch !== STATUS_CHANNEL && ch !== STARRED_CHANNEL && isFavorite(ch) && !isIgnored(ch));
  if (favChans.length > 0 || channels.has(STARRED_CHANNEL)) {
    const favSection = document.createElement('div');
    favSection.className = 'tree-section';
    const favLabel = document.createElement('div');
    favLabel.className = 'tree-section-label fav-label';
    favLabel.textContent = '\u2605 Favorites';
    favSection.appendChild(favLabel);

    // Starred meta-channel always first
    if (channels.has(STARRED_CHANNEL)) {
      favSection.appendChild(createChannelItem(STARRED_CHANNEL));
    }

    favChans.sort();
    for (const ch of favChans) {
      favSection.appendChild(createChannelItem(ch));
    }
    treeScroll.appendChild(favSection);
  }

  // Sort groups alphabetically
  const sortedGroups = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  for (const [groupName, chans] of sortedGroups) {
    const section = document.createElement('div');
    section.className = 'tree-section';
    chans.sort();

    // Open or closed is the only thing that decides what shows; activity only highlights.
    const open = groupOpen.has(groupName) ? groupOpen.get(groupName) : chans.includes(activeChannel);
    const groupUnread = chans.reduce((sum, ch) => sum + (channelUnread.get(ch) || 0), 0);
    const unreadBadge = groupUnread > 0
      ? `<span class="group-unread">${groupUnread > 99 ? '99+' : groupUnread}</span>` : '';

    const label = document.createElement('div');
    label.className = 'tree-section-label' + (open ? '' : ' collapsed');
    label.innerHTML = groupLabelHtml(groupName) + `<span class="group-count">${chans.length}</span>` + unreadBadge;
    label.addEventListener('click', () => {
      groupOpen.set(groupName, !open);
      saveGroupState();
      renderTree();
    });
    section.appendChild(label);

    if (open) for (const ch of chans) section.appendChild(createChannelItem(ch));

    treeScroll.appendChild(section);
  }

  // Ignored: folded by default, so one can be brought back
  const ignoredNow = [...channels.keys()].filter(ch => !isMetaChannel(ch) && isIgnored(ch)).sort();
  if (ignoredNow.length > 0) {
    const igSection = document.createElement('div');
    igSection.className = 'tree-section';
    const igLabel = document.createElement('div');
    igLabel.className = 'tree-section-label' + (ignoredOpen ? '' : ' collapsed');
    igLabel.textContent = `Ignored (${ignoredNow.length})`;
    igLabel.addEventListener('click', () => {
      ignoredOpen = !ignoredOpen;
      try { localStorage.setItem('irc_ignored_open', ignoredOpen ? '1' : '0'); } catch { /* storage blocked */ }
      renderTree();
    });
    igSection.appendChild(igLabel);
    if (ignoredOpen) {
      for (const ch of ignoredNow) {
        const row = document.createElement('div');
        row.className = 'ignored-row';
        const name = document.createElement('span');
        name.className = 'ign-name';
        name.textContent = ch;
        name.style.cursor = 'pointer';
        name.title = 'Open it (read only: nothing new is added while ignored)';
        name.addEventListener('click', () => switchChannel(ch));
        row.appendChild(name);
        if (isIgnoredLocal(ch)) {
          const b = document.createElement('button');
          b.textContent = 'show';
          b.title = 'Stop ignoring here';
          b.addEventListener('click', () => toggleIgnoreLocal(ch));
          row.appendChild(b);
        }
        if (isIgnoredRecorder(ch)) {
          const kind = document.createElement('span');
          kind.className = 'ign-kind';
          kind.textContent = 'recorder';
          row.appendChild(kind);
          if (syncOn()) {
            const b = document.createElement('button');
            b.textContent = 'record';
            b.title = 'Tell the recorder to record this talkgroup again';
            b.addEventListener('click', () => setIgnoreRecorder(ch, false));
            row.appendChild(b);
          }
        }
        igSection.appendChild(row);
      }
    }
    treeScroll.appendChild(igSection);
  }
}


// ══════════════════════════════════════════════════════════════
// NICKLIST
// ══════════════════════════════════════════════════════════════

function renderNicklist() {
  const state = channels.get(activeChannel);
  if (!state) {
    nicklistHeader.textContent = 'Users';
    nicklistEntries.textContent = '';
    return;
  }

  // For starred channel, collect users from all favorited channels
  let users;
  if (activeChannel === STARRED_CHANNEL) {
    const seen = new Set();
    users = [];
    for (const [chName, chState] of channels) {
      if (chName === STATUS_CHANNEL || chName === STARRED_CHANNEL || !isFavorite(chName)) continue;
      for (const u of chState.users.values()) {
        const uk = `${u.systemId}:${u.unitId}`;
        if (!seen.has(uk)) {
          seen.add(uk);
          users.push(u);
        }
      }
    }
  } else {
    users = [...state.users.values()];
  }
  // Sort: online first, then alphabetical within each group
  const sortUser = (a, b) => {
    const ao = a.online === false ? 1 : 0;
    const bo = b.online === false ? 1 : 0;
    if (ao !== bo) return ao - bo;
    return a.nick.localeCompare(b.nick);
  };
  const ops = users.filter(u => u.role === 'op').sort(sortUser);
  const voiced = users.filter(u => u.role === 'voice').sort(sortUser);
  const regular = users.filter(u => u.role === 'regular').sort(sortUser);
  const onlineCount = users.filter(u => u.online !== false).length;

  // Collect nicks that have spoken in the displayed history
  const talkedNicks = new Set();
  for (const m of state.messages) {
    if (m.nick) talkedNicks.add(m.nick);
  }

  nicklistHeader.textContent = `Users (${onlineCount}/${users.length})`;
  nicklistEntries.innerHTML = '';

  function addSection(label, list, cls, prefix) {
    if (list.length === 0) return;
    const lbl = document.createElement('div');
    lbl.className = 'nicklist-section-label';
    lbl.textContent = `${label} (${list.length})`;
    nicklistEntries.appendChild(lbl);
    for (const u of list) {
      const el = document.createElement('div');
      el.className = `nick-item ${cls}` + (u.online === false ? ' offline' : '') + (talkedNicks.has(u.nick) ? ' talked' : '');
      el.innerHTML = `<span class="nick-prefix">${prefix}</span>${esc(u.nick)}`;
      el.addEventListener('mouseenter', () => showNickTooltip(u.nick, el));
      el.addEventListener('mouseleave', hideNickTooltip);
      el.addEventListener('click', () => openUnitModal(u));
      nicklistEntries.appendChild(el);
    }
  }

  addSection('Ops', ops, 'op', '@');
  addSection('Voiced', voiced, 'voice', '+');
  addSection('Users', regular, 'regular', ' ');

  chanCountEl.textContent = `${onlineCount}/${users.length} users`;
}

// CHANNEL NAME EDITING
// ══════════════════════════════════════════════════════════════

let channelEditActive = false;

function startChannelEdit() {
  const state = channels.get(activeChannel);
  if (!state || !state.tgid) return;
  channelEditActive = true;

  // Build inline edit row
  const row = document.createElement('span');
  row.className = 'chan-edit-row';
  row.id = 'chan-edit-row';

  const input = document.createElement('input');
  input.className = 'chan-edit-input';
  input.value = state.alpha_tag || '';
  input.spellcheck = false;

  const saveBtn = document.createElement('button');
  saveBtn.className = 'chan-edit-save';
  saveBtn.textContent = 'Save';
  saveBtn.onclick = () => saveChannelTag(input.value.trim());

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'chan-edit-cancel';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = cancelChannelEdit;

  input.onkeydown = (e) => {
    if (e.key === 'Enter') saveBtn.click();
    if (e.key === 'Escape') cancelChannelEdit();
  };

  row.appendChild(input);
  row.appendChild(saveBtn);
  row.appendChild(cancelBtn);

  chanNameEl.style.display = 'none';
  chanEditBtn.style.display = 'none';
  chanNameEl.parentNode.insertBefore(row, chanNameEl.nextSibling);
  input.focus();
  input.select();
}

function cancelChannelEdit() {
  channelEditActive = false;
  const row = document.getElementById('chan-edit-row');
  if (row) row.remove();
  chanNameEl.style.display = '';
  const state = channels.get(activeChannel);
  if (state && state.tgid) chanEditBtn.style.display = 'inline-block';
}

// The description (the topic line) is the recorder's: it is written to the talkgroup file and comes back
// as the recorder's edit, so it needs control access and Sync on.

function startDescEdit() {
  const state = channels.get(activeChannel);
  if (!state || !state.tgid || !syncOn() || descEditActive) return;
  descEditActive = true;
  const topicEl = document.getElementById('chan-topic');
  const row = document.createElement('span');
  row.className = 'chan-edit-row';
  row.id = 'chan-desc-row';
  row.style.flex = '1';
  const input = document.createElement('input');
  input.className = 'chan-edit-input';
  input.style.flex = '1';
  input.value = state.description || '';
  input.placeholder = 'Description';
  input.spellcheck = false;
  const save = document.createElement('button');
  save.className = 'chan-edit-save'; save.textContent = 'Save';
  save.onclick = () => saveDescription(input.value.trim());
  const cancel = document.createElement('button');
  cancel.className = 'chan-edit-cancel'; cancel.textContent = 'Cancel';
  cancel.onclick = cancelDescEdit;
  input.onkeydown = (e) => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') cancelDescEdit(); };
  row.append(input, save, cancel);
  topicEl.style.display = 'none';
  topicEl.parentNode.insertBefore(row, topicEl.nextSibling);
  updateIgnoreBar();
  input.focus();
  input.select();
}

function cancelDescEdit() {
  descEditActive = false;
  const row = document.getElementById('chan-desc-row');
  if (row) row.remove();
  document.getElementById('chan-topic').style.display = '';
  updateIgnoreBar();
}

function saveDescription(text) {
  const state = channels.get(activeChannel);
  cancelDescEdit();
  if (!state || !state.tgid || text === (state.description || '')) return;
  if (!rec.connected) { syncNotice('Offline: the description was not changed'); return; }
  const key = tgKey(state.system_id, state.tgid);
  descPending.add(key);
  writeTalkgroup(state.system_id, state.tgid, { description: text }).then((r) => {
    if (r.error && descPending.delete(key)) syncNotice(`The description was not changed: ${r.error}`);
  });
}

document.getElementById('chan-desc-btn').addEventListener('click', startDescEdit);

/** Give a talkgroup's channel the name `newTag` (the recorder's, or one typed here): renames the channel and refreshes the display. */
function applyChannelName(state, newTag) {
  const key = tgKey(state.system_id, state.tgid);
  const oldChanName = tgidToChannel.get(key);
  if (!oldChanName) return;
  state.alpha_tag = newTag || String(state.tgid);

  const newChanName = toChannelName(state.alpha_tag);
  let finalName = newChanName;
  if (channels.has(finalName) && channels.get(finalName) !== state) {
    finalName = disambiguatedName(newChanName, state.system_id, state.tgid);
  }
  if (finalName !== oldChanName) renameChannel(oldChanName, finalName);

  if (activeChannel === finalName) {
    chanNameEl.textContent = finalName;
    titlebarChan.textContent = state.tgid ? `${finalName} (TG ${state.tgid})` : finalName;
  }
  renderTree();
}

function saveChannelTag(newTag) {
  const state = channels.get(activeChannel);
  if (!state || !state.tgid || !newTag) return;

  const key = tgKey(state.system_id, state.tgid);
  const pendKey = `tg:${key}`;
  const recorderName = tgMeta(state.system_id, state.tgid).alphaTag || '';

  // Kept here first (so a failed write isn't lost); the recorder's own name again drops it.
  if (newTag === recorderName) delete nameOverrides.tg[key];
  else nameOverrides.tg[key] = newTag;
  try { saveNameOverrides(); } catch (err) { console.error('Failed to save the rename:', err); }
  applyChannelName(state, newTag);
  cancelChannelEdit();

  if (!syncOn()) return;                       // listen access, or Sync off: stays in this browser
  if (newTag === recorderName) { pendingRenames.delete(pendKey); return; }
  if (!rec.connected) {
    pendingRenames.add(pendKey);
    syncNotice(`Offline: ${newTag} is kept here until the recorder is back (/sync push)`);
    return;
  }
  pendingRenames.add(pendKey);
  writeTalkgroup(state.system_id, state.tgid, { alphaTag: newTag }).then((r) => {
    if (r.error && pendingRenames.has(pendKey)) syncNotice(`Could not save ${newTag} on the recorder (${r.error}); it is kept here (/sync status)`);
  });
}

/** The recorder changed a talkgroup's cells (ours, or someone else's): its name wins over one kept here. */
function handleTalkgroupEdited(m) {
  const edit = m.edit || {};
  if (edit.alphaTag !== undefined) {
    const key = tgKey(m.system, m.talkgroup);
    const mine = nameOverrides.tg[key];
    delete nameOverrides.tg[key];
    try { saveNameOverrides(); } catch { /* storage blocked */ }
    const wasPending = pendingRenames.delete(`tg:${key}`);
    const chanName = tgidToChannel.get(key);
    if (chanName && channels.has(chanName)) applyChannelName(channels.get(chanName), edit.alphaTag);
    if (wasPending) syncNotice(edit.alphaTag === mine ? `Saved ${mine} on the recorder` : `The recorder's name for ${key} is ${edit.alphaTag || '(none)'}`);
  }
  if (edit.description !== undefined && descPending.delete(tgKey(m.system, m.talkgroup))) {
    syncNotice(`Saved the description on the recorder: ${edit.description || '(none)'}`);
  }
  refreshTalkgroups(m.system);
  updateIgnoreBar();
}

chanEditBtn.addEventListener('click', startChannelEdit);
titlebarEditBtn.addEventListener('click', startChannelEdit);
